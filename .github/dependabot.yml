# Weekly dependency updates. Security advisories always open PRs regardless
# of schedule; the weekly batch keeps routine bumps from drowning the repo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Routine minor/patch bumps arrive as one PR; majors stay separate.
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Majors the toolchain can't take yet — drop a rule once its blocker clears.
    ignore:
      # TS 7 is the native compiler; its package has no classic compiler API,
      # which Next's build typecheck and typescript-eslint (<6.1) still require.
      - dependency-name: typescript
        versions: [">=7"]
      # eslint-config-next's react/import/jsx-a11y plugins cap their eslint peer at ^9.
      - dependency-name: eslint
        versions: [">=10"]
      # Track the Node version CI and tooling run on (node-version: 22).
      - dependency-name: "@types/node"
        versions: [">=23"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
