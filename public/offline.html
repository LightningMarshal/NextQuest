<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0B0D11" />
		<title>Offline · NextQuest</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<style>
			:root {
				color-scheme: dark;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 24px;
				background: #0b0d11;
				color: #e7ebf1;
				font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
				text-align: center;
			}
			main {
				max-width: 22rem;
			}
			img {
				width: 72px;
				height: 72px;
				border-radius: 16px;
			}
			h1 {
				margin: 20px 0 8px;
				font-size: 1.375rem;
				letter-spacing: -0.02em;
			}
			p {
				margin: 0 0 24px;
				color: #a3acba;
				line-height: 1.5;
			}
			button {
				appearance: none;
				border: 0;
				border-radius: 10px;
				padding: 12px 20px;
				font: inherit;
				font-weight: 600;
				color: #06222a;
				background: #34d1e6;
				cursor: pointer;
			}
			button:focus-visible {
				outline: 3px solid #e7ebf1;
				outline-offset: 3px;
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/icons/icon-192.png" alt="" />
			<h1>You're offline</h1>
			<p>
				NextQuest needs a connection to show who's in and what's on. Nothing is lost — it'll be right here when you're
				back.
			</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</main>
		<script>
			// Come back by itself the moment the connection does.
			addEventListener("online", () => location.reload());
		</script>
	</body>
</html>
