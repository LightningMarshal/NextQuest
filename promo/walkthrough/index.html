<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NextQuest Walkthrough</title>
<meta name="description" content="A 70-second narrated walkthrough of NextQuest, composited from screenshots of the real app.">
<!--FONTS-->
<style>
:root {
	--ink: #06080b;
	--surface: #12151b;
	--line: #262d38;
	--fg: #e7ebf1;
	--dim: #8a93a3;
	--cyan: #34d1e6;
	--violet: #8b7cff;
	--green: #3fcf8e;
	--amber: #ffc94a;
	color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
	background: #0b0d11;
	color: var(--fg);
	font-family: 'Hanken Grotesk', system-ui, sans-serif;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 14px;
	padding: 16px;
	overflow-x: hidden;
}
#viewport {
	position: relative;
	width: min(100%, calc((100vh - 110px) * 16 / 9));
	aspect-ratio: 16 / 9;
	overflow: hidden;
	border-radius: 12px;
	background: var(--ink);
	box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}
body.export { padding: 0; display: block; overflow: hidden; }
#viewport.export { width: 1920px; height: 1080px; border-radius: 0; box-shadow: none; aspect-ratio: auto; }
#stage {
	position: absolute;
	left: 0;
	top: 0;
	width: 1920px;
	height: 1080px;
	transform-origin: 0 0;
	overflow: hidden;
	background: var(--ink);
	contain: strict;
}
.abs { position: absolute; left: 0; top: 0; }
#world { position: absolute; inset: 0; perspective: 1800px; perspective-origin: 960px 480px; }

/* ---------- backdrop */
#bg { position: absolute; inset: -80px; background:
	radial-gradient(900px 600px at var(--gx, 70%) var(--gy, 40%), rgba(52, 209, 230, 0.13), transparent 70%),
	radial-gradient(800px 700px at var(--vx, 20%) var(--vy, 80%), rgba(139, 124, 255, 0.12), transparent 70%),
	var(--ink); }
#grid { position: absolute; inset: 0; opacity: 0.5;
	background-image: linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
	background-size: 64px 64px;
	mask-image: radial-gradient(1100px 700px at 50% 45%, #000 30%, transparent 85%); }

/* ---------- type */
.kicker { font: 600 22px/1 'JetBrains Mono', monospace; letter-spacing: 0.18em; color: var(--cyan); text-transform: uppercase; white-space: nowrap; }
.headline { font: 800 78px/1.02 'Unbounded', sans-serif; letter-spacing: -0.02em; color: var(--fg); white-space: nowrap; }
.headline em { font-style: normal; color: var(--cyan); }
.mask { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.08em; margin-bottom: -0.08em; }
.wd { display: inline-block; will-change: transform; }
.steps { display: flex; flex-direction: column; gap: 22px; }
.step { position: relative; display: flex; align-items: center; gap: 20px; font: 600 34px/1.1 'Space Grotesk', sans-serif; color: var(--dim); white-space: nowrap; }
.step .box { width: 40px; height: 40px; border-radius: 12px; border: 2px solid #343c4a; display: grid; place-items: center; flex: none; position: relative; }
.step .box svg { width: 26px; height: 26px; color: var(--ink); position: relative; z-index: 1; }
.step .fillc { position: absolute; inset: -2px; border-radius: 12px; background: var(--cyan); }
.step .lbl { position: relative; }
.step .lbl b { position: absolute; inset: 0; color: var(--fg); font-weight: 600; white-space: nowrap; overflow: hidden; }

/* ---------- devices */
.phone { width: 418px; height: 872px; border-radius: 64px; padding: 14px; background: linear-gradient(150deg, #2a303b, #0d1015 45%, #1d222b); box-shadow: 0 0 0 2px #3a414d, 0 50px 120px rgba(0, 0, 0, 0.7), 0 0 80px rgba(52, 209, 230, 0.08); }
.phone .screen { position: relative; width: 390px; height: 844px; border-radius: 50px; overflow: hidden; background: #0b0d11; }
.cam { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 0 0; }
.shot { position: absolute; left: 0; top: 0; width: 390px; height: 844px; }
.shot img { width: 100%; height: 100%; display: block; }
.ring { position: absolute; border: 3px solid var(--cyan); border-radius: 14px; box-shadow: 0 0 24px rgba(52, 209, 230, 0.6); pointer-events: none; }
.tap { position: absolute; width: 0; height: 0; pointer-events: none; }
.tap i { position: absolute; left: -28px; top: -28px; width: 56px; height: 56px; border-radius: 50%; }
.tap .dot { background: rgba(255, 255, 255, 0.55); box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.8), 0 6px 18px rgba(0, 0, 0, 0.4); }
.tap .wave { border: 3px solid rgba(255, 255, 255, 0.9); }

.browser { width: 1440px; border-radius: 22px; overflow: hidden; background: #0b0d11; box-shadow: 0 0 0 2px #2a313d, 0 60px 140px rgba(0, 0, 0, 0.7), 0 0 90px rgba(139, 124, 255, 0.1); }
.browser .bar { height: 52px; background: #161a21; display: flex; align-items: center; gap: 12px; padding: 0 22px; border-bottom: 1px solid #262d38; }
.browser .bar i { width: 14px; height: 14px; border-radius: 50%; background: #3a414d; }
.browser .url { margin-left: 18px; flex: 1; height: 32px; border-radius: 10px; background: #0d1015; color: var(--dim); font: 500 17px/32px 'JetBrains Mono', monospace; padding: 0 16px; }
.browser .view { position: relative; width: 1440px; height: 900px; overflow: hidden; }
.browser .shot { width: 1440px; height: 900px; }

/* ---------- discord */
.dc { width: 980px; border-radius: 18px; overflow: hidden; background: #313338; color: #dbdee1; font-family: 'Hanken Grotesk', sans-serif; box-shadow: 0 0 0 2px #1e1f22, 0 60px 140px rgba(0, 0, 0, 0.7); }
.dc .chan { height: 62px; display: flex; align-items: center; gap: 12px; padding: 0 26px; border-bottom: 2px solid #26272b; font: 700 24px/1 'Hanken Grotesk', sans-serif; color: #f2f3f5; }
.dc .chan svg { width: 28px; height: 28px; color: #80848e; }
.dc .msgs { position: relative; padding: 18px 26px 26px; display: flex; flex-direction: column; gap: 20px; }
.dc .msg { display: grid; grid-template-columns: 64px 1fr; column-gap: 18px; }
.dc .av { width: 60px; height: 60px; border-radius: 50%; background: #0b0d11; display: grid; place-items: center; }
.dc .av svg { width: 44px; height: 44px; }
.dc .who { font: 700 24px/1.3 'Hanken Grotesk', sans-serif; color: #f2f3f5; display: flex; align-items: center; gap: 10px; }
.dc .app { font: 700 14px/1 'Hanken Grotesk', sans-serif; background: #5865f2; color: #fff; padding: 4px 6px; border-radius: 4px; }
.dc .ts { font: 500 17px/1 'Hanken Grotesk', sans-serif; color: #949ba4; }
.dc .text { font: 500 23px/1.4 'Hanken Grotesk', sans-serif; color: #dbdee1; margin-top: 4px; }
.dc .text b { color: #f2f3f5; }
.dc .text a, .dc .embed .title { color: #00a8fc; text-decoration: none; }
.dc .ts-chip { background: rgba(255, 255, 255, 0.07); border-radius: 4px; padding: 0 4px; }
.dc .embed { position: relative; margin-top: 8px; max-width: 760px; background: #2b2d31; border-radius: 6px; border-left: 6px solid #2ecc71; padding: 16px 20px 18px 18px; display: grid; grid-template-columns: 1fr auto; column-gap: 18px; }
.dc .embed > * { grid-column: 1; }
.dc .embed .title { font: 700 25px/1.3 'Hanken Grotesk', sans-serif; }
.dc .embed .desc { font: 500 21px/1.4 'Hanken Grotesk', sans-serif; margin-top: 8px; }
.dc .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; margin-top: 14px; }
.dc .field { grid-column: 1 / -1; position: relative; }
.dc .field.inline { grid-column: auto; }
.dc .fname { font: 700 19px/1.3 'Hanken Grotesk', sans-serif; color: #f2f3f5; }
.dc .fval { font: 500 21px/1.4 'Hanken Grotesk', sans-serif; margin-top: 2px; }
.dc .flash { opacity: 0; position: absolute; inset: -6px -10px; border-radius: 8px; background: rgba(52, 209, 230, 0.16); box-shadow: inset 0 0 0 2px rgba(52, 209, 230, 0.5); }
.dc .embed > .thumb { width: 168px; height: 79px; border-radius: 6px; object-fit: cover; grid-row: 1 / span 2; grid-column: 2; }
.dc .foot { margin-top: 14px; font: 500 17px/1.3 'Hanken Grotesk', sans-serif; color: #b5bac1; }
.dc .edited { font-size: 16px; color: #949ba4; margin-left: 6px; }
.toast { display: flex; align-items: center; gap: 16px; padding: 14px 22px 14px 14px; border-radius: 18px; background: rgba(18, 21, 27, 0.92); border: 1px solid #2b3340; font: 600 26px/1 'Space Grotesk', sans-serif; white-space: nowrap; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
.face { display: inline-grid; place-items: center; border-radius: 50%; color: #06080b; font-weight: 800; font-style: normal; flex: none; }
.toast .ok { color: var(--green); }

/* ---------- chat wall */
.bubble { display: flex; align-items: flex-end; gap: 14px; white-space: nowrap; }
.bubble .b { padding: 16px 24px; border-radius: 26px 26px 26px 8px; background: #1a1f27; border: 1px solid #262d38; font: 500 30px/1.2 'Hanken Grotesk', sans-serif; color: #cfd5de; }
.bubble .n { font: 600 18px/1 'Space Grotesk', sans-serif; color: var(--dim); margin-bottom: 8px; display: block; }
.badge { min-width: 150px; height: 150px; padding: 0 34px; border-radius: 80px; background: #ff4d5e; color: #fff; display: grid; place-items: center; font: 800 76px/1 'Unbounded', sans-serif; box-shadow: 0 30px 80px rgba(255, 77, 94, 0.45); }

/* ---------- logo */
.mark { position: absolute; border-radius: 24%; background: linear-gradient(145deg, #1b2029, #0b0d11 70%); border: 2px solid rgba(255, 255, 255, 0.09); box-shadow: 0 0 0 1px rgba(52, 209, 230, 0.15), 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08); }
.mark svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.wm { position: absolute; font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: -0.035em; white-space: nowrap; line-height: 1.2; }
.wm .n { color: var(--fg); display: inline-block; }
.wm .q { color: var(--cyan); display: inline-block; }
.tagline { font: 700 54px/1.1 'Unbounded', sans-serif; letter-spacing: -0.01em; white-space: nowrap; color: var(--fg); }
.url { font: 500 26px/1 'JetBrains Mono', monospace; color: var(--dim); white-space: nowrap; }

/* ---------- captions + chapter bar */
#cap { position: absolute; left: 0; right: 0; top: 958px; display: flex; justify-content: center; pointer-events: none; }
#cap span { max-width: 1500px; text-align: center; padding: 10px 26px 12px; border-radius: 14px; background: rgba(6, 8, 11, 0.78); font: 600 36px/1.25 'Hanken Grotesk', sans-serif; color: #f5f7fa; }
#bar { position: absolute; left: 120px; right: 120px; top: 1040px; height: 4px; display: flex; gap: 10px; }
#bar i { position: relative; flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
#bar i b { position: absolute; inset: 0; background: var(--cyan); transform-origin: 0 50%; }
#flash { position: absolute; inset: 0; background: #fff; pointer-events: none; mix-blend-mode: overlay; }

/* ---------- player chrome */
.controls { display: flex; align-items: center; gap: 14px; width: min(100%, calc((100vh - 110px) * 16 / 9)); font: 500 14px 'JetBrains Mono', monospace; color: #8a93a3; }
.controls button { font: 600 14px 'JetBrains Mono', monospace; letter-spacing: 0.08em; background: #34d1e6; color: #06080b; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
#scrub { flex: 1; height: 6px; border-radius: 3px; background: #262d38; cursor: pointer; position: relative; }
#scrubFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; background: #34d1e6; }
body.export .controls { display: none; }
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div id="bg"></div><div id="grid"></div><div id="world"></div><div id="cap"><span></span></div><div id="bar"></div><div id="flash"></div></div></div>
<div class="controls"><button id="play">PLAY WITH SOUND</button><div id="scrub"><div id="scrubFill"></div></div><span id="time">0.0</span></div>
<!--SCRIPTS-->
</body>
</html>
