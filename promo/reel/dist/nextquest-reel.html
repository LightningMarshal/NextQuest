<div id="viewport">
	<div id="stage">
		<canvas id="bg" width="1920" height="1080"></canvas>
		<div id="world"></div>
		<canvas id="fx" width="1920" height="1080"></canvas>

	<span id="time">0.0 / 15.0</span>

<script>
/*
 * Soundtrack for the NextQuest promo: an original score, foley and the mix,
 * all synthesized in JavaScript and rendered with an OfflineAudioContext.
 *
 * Score: F major, 100 BPM (0.6 s/beat). Beat numbers below are absolute
 * (beat b starts at b * 0.6 s), so musical hits line up with scenes.js cues.
 */
"use strict";

const SR = 48000;
const BEAT = 0.6;
const bt = (b) => b * BEAT;

// ------------------------------------------------------------------ pitch
const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function midi(name) {
	const m = /^([A-G])(#|b)?(-?\d)$/.exec(name);
	let n = NOTE_IDX[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
	return n + (parseInt(m[3], 10) + 1) * 12;
}
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
const hz = (name) => mtof(midi(name));

// deterministic noise so every render is identical
let _seed = 1;
function nrand() {
	_seed = (_seed * 1664525 + 1013904223) >>> 0;
	return _seed / 4294967296 * 2 - 1;
}

// ------------------------------------------------------------------ DSP helpers
function biquadCoefs(type, f, Q, gainDb = 0) {
	const w0 = (2 * Math.PI * Math.min(f, SR * 0.45)) / SR;
	const cw = Math.cos(w0);
	const sw = Math.sin(w0);
	const alpha = sw / (2 * Q);
	const A = Math.pow(10, gainDb / 40);
	let b0, b1, b2, a0, a1, a2;
	switch (type) {
		case "lp":
			b0 = (1 - cw) / 2; b1 = 1 - cw; b2 = (1 - cw) / 2; a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha;
			break;
		case "hp":
			b0 = (1 + cw) / 2; b1 = -(1 + cw); b2 = (1 + cw) / 2; a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha;
			break;
		case "bp":
			b0 = alpha; b1 = 0; b2 = -alpha; a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha;
			break;
		case "peak":
			b0 = 1 + alpha * A; b1 = -2 * cw; b2 = 1 - alpha * A; a0 = 1 + alpha / A; a1 = -2 * cw; a2 = 1 - alpha / A;
			break;
	}
	return [b0 / a0, b1 / a0, b2 / a0, a1 / a0, a2 / a0];
}

/** Filter in place. `f` may be a number or a function of time (seconds) for sweeps. */
function filt(x, type, f, Q = 0.707, gainDb = 0) {
	let c = biquadCoefs(type, typeof f === "function" ? f(0) : f, Q, gainDb);
	let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
	for (let n = 0; n < x.length; n++) {
		if (typeof f === "function" && (n & 63) === 0) c = biquadCoefs(type, f(n / SR), Q, gainDb);
		const xn = x[n];
		const y = c[0] * xn + c[1] * x1 + c[2] * x2 - c[3] * y1 - c[4] * y2;
		x2 = x1; x1 = xn; y2 = y1; y1 = y;
		x[n] = y;
	}
	return x;
}

function buf(sec) {
	return new Float32Array(Math.max(1, Math.ceil(sec * SR)));
}

/** Attack/decay envelope multiply in place. */
function adsr(x, a, d, s, r, holdSec) {
	const A = a * SR, D = d * SR, H = holdSec * SR, R = r * SR;
	for (let n = 0; n < x.length; n++) {
		let e;
		if (n < A) e = n / A;
		else if (n < A + D) e = 1 - (1 - s) * ((n - A) / D);
		else if (n < H) e = s;
		else e = s * Math.max(0, 1 - (n - H) / R);
		x[n] *= e;
	}
	return x;
}

function fadeOut(x, sec = 0.01) {
	const N = Math.min(x.length, Math.floor(sec * SR));
	for (let k = 0; k < N; k++) x[x.length - 1 - k] *= k / N;
	return x;
}

// wavetables (band-limited) -------------------------------------------------
const TABLE_N = 4096;
const tableCache = new Map();
function table(kind, nh) {
	const key = kind + nh;
	if (tableCache.has(key)) return tableCache.get(key);
	const t = new Float32Array(TABLE_N + 1);
	for (let h = 1; h <= nh; h++) {
		let a = 0;
		if (kind === "saw") a = 1 / h;
		else if (kind === "square") a = h % 2 ? 1 / h : 0;
		else if (kind === "reed") a = h % 2 ? 1 / h : 0.35 / h;
		else if (kind === "brass") a = 1 / Math.pow(h, 0.9);
		if (!a) continue;
		for (let n = 0; n < TABLE_N; n++) t[n] += a * Math.sin((2 * Math.PI * h * n) / TABLE_N);
	}
	let mx = 0;
	for (let n = 0; n < TABLE_N; n++) mx = Math.max(mx, Math.abs(t[n]));
	for (let n = 0; n < TABLE_N; n++) t[n] /= mx;
	t[TABLE_N] = t[0];

/** Karplus-Strong plucked string with allpass tuning. */
function pluck(freq, dur, o = {}) {

	const d = P - 0.5 - L;

	// excitation: filtered noise burst (brightness) with pluck-position comb
	let lp = 0;
	const br = o.bright ?? 0.5;
	for (let k = 0; k < L; k++) {
		lp += (nrand() - lp) * (0.15 + br * 0.8);
		line[k] = lp;
	}
	let mean = 0;
	for (let k = 0; k < L; k++) mean += line[k];
	mean /= L;
	for (let k = 0; k < L; k++) line[k] -= mean;
	const pos = Math.max(1, Math.floor(L * (o.pos ?? 0.18)));
	const tmp = Float32Array.from(line);
	for (let k = 0; k < L; k++) line[k] = tmp[k] - tmp[(k + pos) % L] * 0.7;

	let prev = 0;
	let apx = 0;
	let apy = 0;
	const damp = o.damp ?? 0.5;
	const holdN = Math.floor(dur * SR);
	for (let n = 0; n < x.length; n++) {
		const out = line[idx];
		const avg = damp * out + (1 - damp) * prev;
		prev = out;
		const ap = C * avg + apx - C * apy;
		apx = avg;
		apy = ap;

		const dk = n < holdN ? decay : decay * 0.985;
		line[idx] = ap * dk;

	const master = ctx.createGain();
	const comp = ctx.createDynamicsCompressor();
	comp.threshold.value = -16;
	comp.knee.value = 8;
	comp.ratio.value = 3;
	comp.attack.value = 0.006;
	comp.release.value = 0.18;
	master.connect(comp);
	comp.connect(ctx.destination);

	const reverb = ctx.createConvolver();
	reverb.buffer = makeIR(ctx, 2.2);
	const revGain = ctx.createGain();
	revGain.gain.value = 0.32;
	reverb.connect(revGain);
	revGain.connect(master);

	// Events are mixed straight into stereo bus arrays in JS (thousands of
	// Web Audio nodes would make the offline render crawl); the audio graph
	// only handles narration, ducking, reverb and bus compression.
	const bus = {
		music: [new Float32Array(len), new Float32Array(len)],
		sfx: [new Float32Array(len), new Float32Array(len)],
		rev: [new Float32Array(len), new Float32Array(len)],
	};
	const dataCache = new Map();
	function play(data, when, which, gain = 1, pan = 0, rev = 0.2, key = null) {
		if (when < 0 || when > DURATION) return;
		let d;
		if (key && dataCache.has(key)) d = dataCache.get(key);
		else {
			d = data instanceof Function ? data() : data;
			if (key) dataCache.set(key, d);
		}
		const a = ((pan + 1) * Math.PI) / 4;
		const gl = Math.cos(a) * gain;
		const gr = Math.sin(a) * gain;
		const [L, R] = bus[which];
		const [RL, RR] = bus.rev;
		const s0 = Math.round(when * SR);
		const n = Math.min(d.length, len - s0);
		for (let k = 0; k < n; k++) {
			const v = d[k];
			L[s0 + k] += v * gl;
			R[s0 + k] += v * gr;
		}
		if (rev > 0) {
			const rl = gl * rev;
			const rr = gr * rev;
			for (let k = 0; k < n; k++) {
				const v = d[k];
				RL[s0 + k] += v * rl;
				RR[s0 + k] += v * rr;
			}
		}
	}
	const music = "music";
	const sfx = "sfx";
	const M = (b, fn, gain, pan, rev, key) => play(fn, bt(b), music, gain, pan, rev, key);

	// ---------------- music
	// celesta intro
	for (const [b, n, l] of MEL_CELESTA) M(b, () => mallet(hz(n), l * BEAT, CELESTA), 0.32, 0.2, 0.35, "cel" + n);
	// pizzicato bass + uke strums (intro, main sections)
	const pizzBass = (b, n, l = 0.45, g = 0.55) => M(b, () => pluck(hz(n), l * BEAT, { bright: 0.35, decay: 0.993, ring: 0.25 }), g, 0, 0.12, "pb" + n + l);
	const uke = (b, ch, g = 0.2, oct = 4) => {
		const notes = CHORD_NOTES[ch].slice(0, 3);
		notes.forEach((nm, i) => {
			const n = nm + (nm === "C" || nm === "D" || nm === "E" || nm === "C#" ? oct + 1 : oct);
			M(b + i * 0.018 / BEAT, () => pluck(hz(n), 0.25 * BEAT, { bright: 0.75, decay: 0.994, ring: 0.3, pos: 0.25 }), g, -0.35, 0.2, "uk" + n);
		});
	};
	const root = (ch, oct) => CHORD_NOTES[ch][0] + oct;
	const fifth = (ch, oct) => CHORD_NOTES[ch][2] + (["C", "D", "E", "C#"].includes(CHORD_NOTES[ch][2]) ? oct + 1 : oct);
	// intro bars 0-1 (beats 0..5)
	for (const b of [0, 1, 2, 3, 4, 5]) pizzBass(b, b % 2 ? "C3" : "F2", 0.4, 0.45);
	// grumble bars 2-3: tuba oom-pah + reed + woodblock
	const tubaLine = [[8, "D2"], [9, "A1"], [10, "D2"], [11, "A1"], [12, "G1"], [13, "D2"], [14, "A1"], [15, "E2"]];
	for (const [b, n] of tubaLine) M(b, () => tuba(hz(n), 0.42 * BEAT), 0.62, 0, 0.1, "tb" + n);
	for (let b = 8; b < 16; b++) {
		const ch = chordAt(b);
		M(b + 0.5, () => {
			const x = buf(0.3);
			for (const nm of CHORD_NOTES[ch].slice(0, 3)) {
				const p = pluck(hz(nm + "3"), 0.18, { bright: 0.4, decay: 0.99, ring: 0.1 });
				for (let n = 0; n < Math.min(x.length, p.length); n++) x[n] += p[n] * 0.5;
			}
			return x;
		}, 0.5, -0.2, 0.15, "gch" + ch);
		M(b, () => woodblock(1100), 0.22, 0.4, 0.1, "wb1");
		M(b + 0.5, () => woodblock(800), 0.16, 0.4, 0.1, "wb2");
	}
	for (const [b, n, l] of MEL_REED) M(b, () => reed(hz(n), l * BEAT), 0.3, 0.15, 0.25, "rd" + n + l);
	// build into the logo
	for (let k = 0; k < 8; k++) M(15 + k * 0.125, () => snare({ decay: 30 }), 0.08 + k * 0.03, 0.1, 0.1, "sn30");

	// main groove: bars 4-11 and 12-18
	const grooveBars = [16, 20, 24, 28, 32, 36, 40, 44, 49, 53, 57, 61, 65, 69];
	for (const start of grooveBars) {
		const beats = start === 44 ? 5 : 4;
		for (let k = 0; k < beats; k++) {
			const b = start + k;
			if (b >= 29.5 && b < 31) continue; // stamp break
			const ch = chordAt(b);
			// bass: root / fifth
			if (b < 44 || b >= 49) pizzBass(b, k % 2 === 0 ? root(ch, 2) : fifth(ch, 2), 0.45, 0.55);
			if (b >= 44 && b < 49) pizzBass(b, "C2", 0.3, 0.45);
			// walking 8th pickup on beat 4
			if (k === 3 && b < 44) pizzBass(b + 0.5, CHORD_NOTES[ch][1] + "2", 0.3, 0.35);
			// uke on the offbeats
			if (b < 44 || b >= 49) uke(b + 0.5, ch, b >= 32 && b < 44 ? 0.16 : 0.2);
			// drums
			if (k % 2 === 0) M(b, () => kick(), b >= 49 ? 0.5 : 0.42, 0, 0.02, "kick");
			else M(b, () => snap(), 0.22, -0.15, 0.25, "snap");
			M(b, () => shaker(), 0.09, 0.45, 0.05, "shk");
			M(b + 0.5, () => shaker(), 0.16, 0.45, 0.05, "shk");
		}
	}
	for (const [b, n, l] of MEL_GLOCK) M(b, () => mallet(hz(n), l * BEAT, GLOCK), 0.3, 0.25, 0.3, "gl" + n);
	for (const [b, n, l] of MEL_MARIMBA) M(b, () => mallet(hz(n), l * BEAT, MARIMBA), 0.42, -0.2, 0.2, "mr" + n);
	// strings pads: picker build and finale
	const pad = (b, len, ch, g = 0.1, oct = 3) => {
		for (const nm of CHORD_NOTES[ch].slice(0, 3)) {
			const n = nm + (nm === "C" || nm === "D" || nm === "E" ? oct + 1 : oct);
			M(b, () => strings(hz(n), len * BEAT), g, 0, 0.35, "st" + n + len);
		}
	};
	pad(40, 4, "Bb", 0.07);
	pad(44, 5, "C", 0.09);
	pad(57, 4, "Bb", 0.07);
	pad(61, 4, "C", 0.09);
	pad(65, 4, "F", 0.09);
	pad(69, 2, "Bb", 0.09);
	pad(71, 2, "C7", 0.09);
	pad(73, 5, "F", 0.1);
	// snare roll into the picker hit
	for (let k = 0; k < 24; k++) M(46 + k * 0.125, () => snare({ decay: 28 }), 0.05 + (k / 24) * 0.22, 0.1, 0.12, "sn28");
	// snare build into the flag + finale
	for (let k = 0; k < 16; k++) M(62 + k * 0.125, () => snare({ decay: 28 }), 0.05 + (k / 16) * 0.18, 0.1, 0.12, "sn28");
	// hits
	const tutti = (b, g = 0.2) => {
		for (const n of ["F3", "A3", "C4", "F4", "A4"]) M(b, () => brassHit(hz(n), 1.2 * BEAT), g * 0.55, 0, 0.3, "bh" + n);
		M(b, () => crash(), 0.28, 0.1, 0.3, "crash");
		M(b, () => timpani(87), 0.6, 0, 0.2, "timp");
		M(b, () => kick({ decay: 5 }), 0.6, 0, 0.1, "kick5");
	};
	M(16, () => crash(), 0.22, 0.1, 0.3, "crash");
	M(16, () => timpani(87), 0.35, 0, 0.2, "timp");
	tutti(49, 0.22);
	M(64, () => timpani(110), 0.45, 0, 0.2, "timp2");
	M(64, () => crash(1.2), 0.16, -0.2, 0.2, "crash12");
	tutti(65, 0.25);
	tutti(73, 0.28);
	// button ending under the iris
	M(77.8, () => pluck(hz("C4"), 0.2, { bright: 0.5 }), 0.4, 0, 0.2);
	M(78.3, () => pluck(hz("F3"), 0.4, { bright: 0.5 }), 0.5, 0, 0.3);
	M(78.3, () => mallet(hz("F6"), 0.5, GLOCK), 0.3, 0.2, 0.4);

	// ---------------- foley
	const S = (t, fn, gain, pan = 0, rev = 0.15, key = null) => play(fn, t, sfx, gain, pan, rev, key);
	// pencil drawing the party
	[0.15, 0.4, 0.65, 0.9].forEach((t, i) => S(t, () => pencil(0.55), 0.22, -0.3 + i * 0.2, 0.05));
	S(0.05, () => pencil(0.9), 0.12, 0, 0.05);
	// incoming!
	S(CUE.shadow + 0.05, () => slideWhistle(1.0), 0.28, 0.2, 0.2);
	S(CUE.thud - 0.02, () => thud(), 1.0, 0, 0.12);
	S(CUE.thud, () => tuba(hz("D2"), 0.9, { bend: -3, bendT: 0.8 }), 0.55, 0, 0.1);
	S(CUE.sign, () => boing(170), 0.25, -0.1, 0.1);
	// items landing on the pile
	for (const it of PILE_ITEMS) {
		if (it.drop === undefined) continue;
		const t = it.drop + 0.33;
		const f = it.kind === "d20" || it.kind === "d6" ? 0 : 1;
		if (f) S(t, () => pop(300 + (it.seed % 7) * 60), 0.32, 0.3, 0.1, "pop" + (it.seed % 7));
		else S(t, () => {
			const x = buf(0.4);
			for (let i = 0; i < 5; i++) {
				const w = woodblock(1500 + i * 230);
				const s = Math.floor(i * 0.06 * SR);
				for (let n = 0; n < w.length && s + n < x.length; n++) x[s + n] += w[n] * (0.6 - i * 0.1);
			}
			return x;
		}, 0.35, 0.3, 0.1, "dice");
	}
	S(CUE.someday, () => {
		const x = kick({ f1: 400, f2: 200, decay: 40, len: 0.1 });
		return x;
	}, 0.3, 0.3, 0.1);
	// whip to the logo
	S(CUE.whip1 - 0.05, () => whoosh(0.55, 250, 2800), 0.5, -0.4, 0.2);
	S(CUE.logo + 0.1, () => sparkle(9, 79, 0.8), 0.5, 0.2, 0.4);
	S(CUE.logo, () => pencil(0.7), 0.16, 0, 0.05);
	S(CUE.subtitle, () => pencil(1.3), 0.14, 0.1, 0.05);
	// monitor draws on + logo flies into the sidebar
	S(CUE.toApp, () => whoosh(0.5, 400, 2000), 0.3, 0.3, 0.2);
	S(CUE.toApp + 0.05, () => pencil(0.8), 0.18, -0.2, 0.05);
	// mouse + typing
	S(13.35, () => clickSfx(2600), 0.5, 0.2, 0.05, "click");
	for (let i = 0; i < 13; i++) S(CUE.typeStart + i * (0.7 / 13), () => clickSfx(1800 + Math.abs(nrand()) * 1500), 0.28, 0.1, 0.03);
	S(14.52, () => clickSfx(2600), 0.5, 0.2, 0.05, "click");
	S(CUE.card, () => pop(420, 0.15), 0.35, 0, 0.15);
	// stat chips
	[CUE.hours, CUE.difficulty, CUE.acclaim].forEach((t, i) => S(t - 0.03, () => pop(520 + i * 160), 0.35, 0.1 * i, 0.15));
	for (let k = 0; k < 5; k++) S(CUE.difficulty + 0.05 + k * 0.07, () => clickSfx(1200 + k * 200), 0.25, 0.2, 0.05);
	S(CUE.formula, () => pencil(0.6), 0.14, 0.1, 0.05);
	S(CUE.stamp - 0.01, () => stampSfx(), 0.9, 0, 0.12);
	// voting
	S(CUE.vote - 0.05, () => swish(0.35, 1400), 0.3, 0, 0.1);
	[0, 1, 2, 3].forEach((i) => S(CUE.vote + 0.3 + i * 0.07, () => boing(220 + i * 40, 0.45), 0.14, -0.5 + i * 0.33, 0.1));
	S(CUE.ten, () => sparkle(4, 84, 0.25), 0.35, 0, 0.3);
	for (const f of FLIGHTS) {
		S(f.t, () => swish(0.12, 3000), 0.06, 0, 0.05, "fl");
		S(f.t + f.dur, () => clink(2400 + (f.jar * 400) + (f.from * 120)), 0.3, -0.35 + f.jar * 0.35, 0.2);
	}
	S(CUE.curtain - 0.05, () => swish(0.5, 700), 0.45, 0, 0.15);
	S(CUE.lock, () => {
		const x = buf(0.2);
		const a = clickSfx(3500);
		const b2 = clickSfx(2200);
		for (let n = 0; n < a.length; n++) x[n] += a[n];
		const s = Math.floor(0.07 * SR);
		for (let n = 0; n < b2.length; n++) x[s + n] += b2[n];
		return x;
	}, 0.6, 0, 0.1);
	[0, 1, 2].forEach((i) => S(CUE.lock + 0.3 + i * 0.12, () => clink(3200 + i * 300), 0.25, -0.35 + i * 0.35, 0.2));
	S(CUE.hurt, () => sparkle(6, 81, 0.6), 0.35, 0, 0.35);
	// picker
	S(CUE.pick - 0.05, () => swish(0.35, 1400), 0.3, 0, 0.1);
	[CUE.interest, CUE.time, CUE.around].forEach((t, i) => {
		S(t - 0.05, () => pop(600 + i * 200, 0.14), 0.35, 0, 0.15);
		S(t + 0.05, () => whoosh(0.4, 600 + i * 300, 2400 + i * 300), 0.12, 0.3, 0.1);
	});
	S(CUE.hit - 0.02, () => popper(), 0.6, -0.4, 0.15);
	S(CUE.hit + 0.02, () => popper(), 0.6, 0.4, 0.15);
	S(CUE.hit + 0.1, () => sparkle(10, 84, 0.9), 0.35, 0, 0.3);
	// events
	S(CUE.events - 0.05, () => swish(0.35, 1400), 0.3, 0, 0.1);
	S(CUE.events + 0.05, () => whoosh(0.4, 1500, 500), 0.15, 0.4, 0.1);
	for (const pnt of PAINT) S(pnt.t, () => swish(0.55, 1100), 0.3, -0.3 + PAINT.indexOf(pnt) * 0.2, 0.15);
	S(CUE.paint + 1.25, () => sparkle(5, 86, 0.3), 0.35, 0, 0.3);
	S(CUE.rsvp - 0.1, () => swish(0.3, 1600), 0.25, 0.4, 0.1);
	[0, 1, 2, 3].forEach((i) => S(CUE.rsvp + 0.08 + i * 0.22, () => mallet(hz(["C6", "E6", "G6", "A5"][i]), 0.2, GLOCK), 0.35, 0.3, 0.3));
	S(CUE.calendar, () => pencil(0.5), 0.25, 0.3, 0.05);
	S(CUE.calendar + 0.35, () => boing(260, 0.4), 0.2, 0.3, 0.1);
	// dashboard
	S(CUE.dash - 0.05, () => swish(0.35, 1400), 0.3, 0, 0.1);
	[0, 1, 2, 3].forEach((i) => S(CUE.dash + 0.1 + i * 0.08, () => pop(700 + i * 90), 0.22, -0.3 + i * 0.2, 0.1));
	S(CUE.chart, () => pencil(0.8), 0.2, 0, 0.05);
	S(CUE.chart + 1.05, () => mallet(hz("C7"), 0.3, GLOCK), 0.3, 0.3, 0.3);
	// back to the mountain
	S(CUE.whip2 - 0.05, () => whoosh(0.55, 2600, 250), 0.5, 0.4, 0.2);
	for (const it of PILE_ITEMS) {
		if (it.poof === undefined) continue;
		if (it.seed % 2 === 0) S(it.poof, () => poof(), 0.2, (it.x / 600) * 0.6, 0.15, "poof");
		else S(it.poof, () => pop(700 + (it.seed % 9) * 70, 0.1), 0.14, (it.x / 600) * 0.6, 0.1, "pp" + (it.seed % 9));
	}
	[0, 1, 2, 3].forEach((i) => S(CUE.hop + i * 0.08, () => boing(200 + i * 30, 0.5), 0.18, -0.3 + i * 0.2, 0.1));
	S(CUE.flag - 0.3, () => whoosh(0.3, 1800, 600), 0.2, 0, 0.1);
	S(CUE.flag - 0.01, () => thud(), 0.35, 0, 0.1);
	S(CUE.flag + 0.02, () => flutter(0.9), 0.25, 0.2, 0.1);
	// finale
	S(CUE.finale - 0.9, () => revCymbal(0.9), 0.3, 0, 0.2);
	S(CUE.finale - 0.02, () => kick({ f1: 110, f2: 38, decay: 3, len: 1.2 }), 0.7, 0, 0.1);
	S(CUE.finale + 0.05, () => sparkle(12, 79, 1.2), 0.3, 0, 0.35);
	S(CUE.stop, () => pencil(1.35), 0.14, -0.1, 0.05);
	S(CUE.start, () => pencil(0.8), 0.14, 0.1, 0.05);
	S(CUE.start + 0.85, () => swish(0.4, 2000), 0.2, 0, 0.1);
	S(CUE.sting, () => sparkle(14, 84, 1.3), 0.4, 0, 0.4);
	S(CUE.iris, () => whoosh(1.2, 1800, 200), 0.12, 0, 0.2);

	// ---------------- graph: buses -> (duck) -> master, reverb, narration
	const busSource = (arrs, dest, gain = 1) => {
		const b = ctx.createBuffer(2, len, SR);
		b.copyToChannel(arrs[0], 0);
		b.copyToChannel(arrs[1], 1);
		const src = ctx.createBufferSource();
		src.buffer = b;
		const g = ctx.createGain();
		g.gain.value = gain;
		src.connect(g);
		g.connect(dest);
		src.start(0);
		return g;
	};
	const musicDuck = ctx.createGain();
	musicDuck.connect(master);
	busSource(bus.music, musicDuck, 0.62);
	busSource(bus.sfx, master, 0.55);
	busSource(bus.rev, reverb, 1);
	// duck music under narration
	const dg = musicDuck.gain;
	dg.setValueAtTime(1, 0);
	LINES.forEach((t0, i) => {
		const t1 = t0 + LINE_DURS[i];
		dg.setTargetAtTime(0.42, Math.max(0, t0 - 0.12), 0.05);
		dg.setTargetAtTime(1, t1 + 0.08, 0.18);
	});
	if (narrationArrayBuffer) {
		const nb = await ctx.decodeAudioData(narrationArrayBuffer.slice(0));
		const src = ctx.createBufferSource();
		src.buffer = nb;
		const voice = ctx.createGain();
		voice.gain.value = 1.0;
		src.connect(voice);
		voice.connect(master);
		const vs = ctx.createGain();
		vs.gain.value = 0.08;
		src.connect(vs);
		vs.connect(reverb);
		src.start(0);
	}

	const out = await ctx.startRendering();
	// master fade + peak normalise to -1 dBFS
	const L = out.getChannelData(0);
	const R = out.getChannelData(1);
	let pk = 0;
	for (let n = 0; n < L.length; n++) pk = Math.max(pk, Math.abs(L[n]), Math.abs(R[n]));
	const g = pk > 0 ? 0.89 / pk : 1;
	const fadeStart = Math.floor((DURATION - 0.35) * SR);
	for (let n = 0; n < L.length; n++) {
		const f = n > fadeStart ? Math.max(0, 1 - (n - fadeStart) / (L.length - fadeStart)) : 1;
		L[n] *= g * f;
		R[n] *= g * f;
	}
	return out;
}

function makeIR(ctx, sec) {
	const len = Math.floor(sec * SR);
	const ir = ctx.createBuffer(2, len, SR);
	for (let ch = 0; ch < 2; ch++) {
		const d = ir.getChannelData(ch);
		let lp = 0;
		for (let n = 0; n < len; n++) {
			const t = n / SR;
			lp += (nrand() - lp) * (0.55 - 0.4 * (t / sec));
			d[n] = lp * Math.pow(1 - t / sec, 2.2) * (t < 0.012 ? t / 0.012 : 1);
		}
	}
	return ir;
}

/** Encode an AudioBuffer as a 16-bit PCM WAV (ArrayBuffer). */
function encodeWav(ab) {
	const ch = ab.numberOfChannels;
	const n = ab.length;
	const out = new DataView(new ArrayBuffer(44 + n * ch * 2));
	const str = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
	str(0, "RIFF");
	out.setUint32(4, 36 + n * ch * 2, true);
	str(8, "WAVE");
	str(12, "fmt ");
	out.setUint32(16, 16, true);
	out.setUint16(20, 1, true);
	out.setUint16(22, ch, true);
	out.setUint32(24, ab.sampleRate, true);
	out.setUint32(28, ab.sampleRate * ch * 2, true);
	out.setUint16(32, ch * 2, true);
	out.setUint16(34, 16, true);
	str(36, "data");
	out.setUint32(40, n * ch * 2, true);
	const chans = [...Array(ch)].map((_, i) => ab.getChannelData(i));
	let o = 44;
	for (let i = 0; i < n; i++)
		for (let c = 0; c < ch; c++) {
			const v = Math.max(-1, Math.min(1, chans[c][i]));
			out.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7fff, true);
			o += 2;
		}
	return out.buffer;
}

/*
 * NextQuest — 15-second motion reel.
 *
 * Everything on screen is DOM + CSS 3D, positioned by render(t), a pure
 * function of time. No CSS transitions or animations, so realtime playback
 * and the frame-by-frame export are identical.
 *
 * Grid: 120 BPM (0.5 s per beat). Cuts and hits land on beats.
 */
"use strict";

const REEL_DUR = 15.0;
const RB = 0.5; // seconds per beat

// ------------------------------------------------------------------ math
const cl = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const mix = (a, b, t) => a + (b - a) * t;
const Ez = {
	lin: (t) => t,
	oc: (t) => 1 - Math.pow(1 - t, 3),
	ic: (t) => t * t * t,
	ioc: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
	oq: (t) => 1 - Math.pow(1 - t, 5),
	oe: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
	ie: (t) => (t === 0 ? 0 : Math.pow(2, 10 * t - 10)),
	ioe: (t) => (t === 0 ? 0 : t === 1 ? 1 : t < 0.5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2),
	ob: (t, s = 1.7) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2),
	ib: (t, s = 1.7) => (s + 1) * t * t * t - s * t * t,
};
const pr = (t, t0, d, e = Ez.ioc) => (d <= 0 ? (t >= t0 ? 1 : 0) : e(cl((t - t0) / d)));
const spr = (t, t0, f = 3, damp = 7) => (t < t0 ? 0 : Math.exp(-damp * (t - t0)) * Math.sin(2 * Math.PI * f * (t - t0)));
const decay = (t, t0, k = 8) => (t < t0 ? 0 : Math.exp(-k * (t - t0)));
const hsh = (n) => {
	const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
	return x - Math.floor(x);
};
const noise1 = (x) => {
	const i = Math.floor(x);
	const f = x - i;
	const u = f * f * (3 - 2 * f);
	return mix(hsh(i), hsh(i + 1), u) * 2 - 1;
};

	const root = add(world, `<div id="${id}" class="abs" style="left:960px;top:${y}px;width:0;height:0"></div>`);

	const mark = add(group, `<div class="mark" style="width:${markSize}px;height:${markSize}px">${CHEV_SVG(6)}</div>`);
	const wm = add(group, `<div class="wm" style="font-size:${fontSize}px">${letters("Next", "n")}${letters("Quest", "q")}</div>`);
	const sub = subText ? add(root, '<div class="meta" style="top:150px;color:#8a93a3"></div>') : null;
	return { root, group, mark, wm, sub, subText, markSize, fontSize, chars: [...wm.querySelectorAll(".n,.q")] };
}

function layoutLogo(L) {
	// centre mark + wordmark as a group once fonts have loaded
	const gap = L.markSize * 0.22;
	const ww = L.wm.offsetWidth;
	const total = L.markSize + gap + ww;
	L.mark.style.left = `${-total / 2}px`;
	L.mark.style.top = `${-L.markSize / 2}px`;
	L.wm.style.left = `${-total / 2 + L.markSize + gap}px`;
	L.wm.style.top = `${-L.fontSize * 0.62}px`;
	L.markX = -total / 2 + L.markSize / 2;
}

	const Wc = 480;
	const Hc = 300;
	const vals = [0, 0.05, 0.09, 0.15, 0.19, 0.26, 0.31, 0.37, 0.42];
	const xs = (i) => 20 + (i / 15) * (Wc - 40);
	const ys = (v) => Hc - 20 - v * (Hc - 60);
	const pts = vals.map((v, i) => [xs(i), ys(v)]);
	const d = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
	const last = pts[pts.length - 1];
	const fin = [xs(14.6), ys(0.92)];
	const area = `${d} L${last[0]},${ys(0)} L${pts[0][0]},${ys(0)} Z`;
	chart.insertAdjacentHTML(
		"beforeend",
		`<svg viewBox="0 0 ${Wc} ${Hc}" preserveAspectRatio="none">
<defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d1e6" stop-opacity=".35"/><stop offset="1" stop-color="#34d1e6" stop-opacity="0"/></linearGradient></defs>
${[0.25, 0.5, 0.75].map((g) => `<line x1="20" x2="${Wc - 20}" y1="${ys(g)}" y2="${ys(g)}" stroke="#262d38" stroke-width="1"/>`).join("")}
<line x1="20" x2="${Wc - 20}" y1="${ys(0.92)}" y2="${ys(0.92)}" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 6" class="tot"/>
<text x="${Wc - 20}" y="${ys(0.92) - 10}" fill="#ff6b6b" font-family="Geist Mono" font-size="13" text-anchor="end" letter-spacing="1.5" class="totl">BACKLOG TOTAL</text>
<path d="${area}" fill="url(#ar)" class="area"/>
<path d="${d}" fill="none" stroke="#34d1e6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" class="line"/>
<path d="M${last[0]},${last[1]} L${fin[0]},${fin[1]}" fill="none" stroke="#8b7cff" stroke-width="3" stroke-dasharray="8 8" class="proj"/>
<g class="flag" transform="translate(${fin[0]},${fin[1]})"><line x1="0" y1="0" x2="0" y2="-44" stroke="#e7ebf1" stroke-width="3"/><path d="M0,-44 L30,-36 L0,-27 Z" fill="#ffc94a"/></g>
<circle cx="${last[0]}" cy="${last[1]}" r="7" fill="#34d1e6" class="dot"/>
</svg>`,
	);
	o.svg = chart.querySelector("svg");
	o.line = o.svg.querySelector(".line");
	o.lineLen = 0;
	o.area = o.svg.querySelector(".area");
	o.proj = o.svg.querySelector(".proj");
	o.flag = o.svg.querySelector(".flag");
	o.dot = o.svg.querySelector(".dot");
	o.tot = o.svg.querySelector(".tot");
	o.totl = o.svg.querySelector(".totl");
	o.kpis = add(chart, '<div class="kpis"><div class="kpi"><b class="k1">0%</b><i>complete</i></div><div class="kpi"><b class="k2" style="color:#34d1e6">0.0</b><i>effort / week</i></div><div class="kpi"><b class="k3">—</b><i>projected finish</i></div></div>');
	o.k = [...o.kpis.querySelectorAll("b")];
	o.fin = fin;
	return o;
}

function layoutReel() {
	layoutLogo(R.logo);
	layoutLogo(R.lock);
	R.p[3].lineLen = R.p[3].line.getTotalLength();
	R.p[3].projLen = R.p[3].proj.getTotalLength();
}

// ------------------------------------------------------------------ style helpers
function T(el, o) {
	const s = el.style;
	const op = o.o ?? 1;
	if (op <= 0.001) {
		if (s.display !== "none") s.display = "none";
		return;
	}
	if (s.display === "none") s.display = "";
	s.opacity = op >= 0.999 ? "" : op.toFixed(3);
	s.transform = `translate3d(${(o.x ?? 0).toFixed(2)}px,${(o.y ?? 0).toFixed(2)}px,${(o.z ?? 0).toFixed(2)}px) rotateX(${(o.rx ?? 0).toFixed(3)}deg) rotateY(${(o.ry ?? 0).toFixed(3)}deg) rotateZ(${(o.rz ?? 0).toFixed(3)}deg) scale(${(o.sx ?? o.s ?? 1).toFixed(4)},${(o.sy ?? o.s ?? 1).toFixed(4)})`;
	const f = [];
	if (o.blur && o.blur > 0.05) f.push(`blur(${o.blur.toFixed(2)}px)`);
	if (o.bright !== undefined) f.push(`brightness(${o.bright.toFixed(3)})`);
	s.filter = f.join(" ");
}
const hide = (el) => {
	if (el.style.display !== "none") el.style.display = "none";
};
function rgbSplit(el, amt) {
	el.style.textShadow =
		amt > 0.2 ? `${amt.toFixed(1)}px 0 rgba(255,60,110,.85), ${(-amt).toFixed(1)}px 0 rgba(52,209,230,.85)` : "";
}
const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+/<>";
function decode(str, p, t, seed = 0) {
	const n = str.length;
	const shown = Math.floor(p * n);
	const tick = Math.floor(t * 30);
	let out = "";
	for (let i = 0; i < n; i++) {
		const c = str[i];
		if (i < shown || c === " " || c === "·") out += c;
		else if (i < shown + 6) out += GLYPHS[Math.floor(hsh(tick * 13.1 + i * 7.7 + seed) * GLYPHS.length)];
		else out += " ";
	}
	return out;
}
function setText(el, s) {
	if (el.textContent !== s) el.textContent = s;
}

// ------------------------------------------------------------------ render
function render(t) {
	renderBG(t);
	renderCamera(t);
	renderAct1(t);
	renderLogo(R.logo, t, TL.hit, true);
	renderAct3(t);
	renderAct4(t);
	renderFX(t);
}

function renderCamera(t) {
	let punch = 0;
	for (const w of TL.words) punch += spr(t, w, 2.2, 9) * 0.035;
	punch += spr(t, TL.hit, 2, 6) * 0.06 + spr(t, TL.final, 2, 6) * 0.06;
	for (const f of TL.feats.slice(1)) punch += spr(t, f, 2.4, 8) * 0.02;
	let sx = 0;
	let sy = 0;
	for (const [t0, a] of [
		[TL.hit, 22],
		[TL.final, 18],
	]) {
		const k = decay(t, t0, 7) * a;
		sx += k * noise1(t * 40 + t0);
		sy += k * noise1(t * 43 + t0 + 9);
	}
	const drift = noise1(t * 0.35) * 0.6;
	T(R.world, { x: sx, y: sy, s: 1 + punch, ry: drift, rx: noise1(t * 0.3 + 5) * 0.4 });
}

function renderAct1(t) {
	// laser
	if (t < 1.0) T(R.laser, { sx: pr(t, TL.laser, 0.45, Ez.oe), sy: 1 + 2 * decay(t, 0.1, 6), o: 1 - pr(t, 0.6, 0.35, Ez.ic) });
	else hide(R.laser);

	// wall of games
	if (t < TL.hit + 0.05) {
		const appear = pr(t, TL.wall, 0.9, Ez.oc);
		const scroll = 260 * t + 2200 * Math.pow(Math.max(0, t - 1.4), 2);
		const rowH = 264;
		const off = -(scroll % rowH);
		let snap = 0;
		TL.words.forEach((w, i) => {
			snap += (i % 2 ? -1 : 1) * 7 * pr(t, w, 0.25, Ez.oe);
		});
		const imp = pr(t, 3.12, 0.38, Ez.ie);
		T(R.wallWrap, {
			z: mix(-700, -150, appear) - imp * 1800,
			rx: mix(64, 52, appear),
			rz: -26 + snap + imp * 70,
			s: mix(1.1, 1, appear) * (1 - imp * 0.6),
			o: appear * 0.62 * (1 - imp),
		});
		T(R.wall, { y: off - 132, blur: Math.min(6, Math.max(0, t - 1.4) * 4) });
	} else hide(R.wallWrap);

	// counter
	if (t > TL.count - 0.05 && t < 1.55) {
		const p = pr(t, TL.count, 0.85, Ez.oq);
		const out = pr(t, 1.32, 0.18, Ez.ic);
		setText(R.countNum, String(Math.round(247 * p)));
		setText(R.countLbl, decode("GAMES IN YOUR GROUP'S BACKLOG", pr(t, 0.62, 0.55, Ez.lin), t, 3));
		T(R.count, { s: mix(1.25, 1, pr(t, TL.count, 0.5, Ez.oe)) * (1 + out * 0.15), blur: (1 - pr(t, TL.count, 0.35, Ez.oc)) * 14 + out * 14, o: pr(t, TL.count, 0.15, Ez.lin) * (1 - out), y: -out * 40 });
	} else hide(R.count);

	// kinetic words, hard cuts on the beat
	R.kw.forEach((el, i) => {
		const t0 = TL.words[i];
		const t1 = i < 3 ? TL.words[i + 1] : TL.hit;
		if (t < t0 || t >= t1) return hide(el);
		const u = pr(t, t0, 0.2, Ez.oe);
		const tilt = (i % 2 ? 1 : -1) * 2;
		let s = mix(1.55, 1, u);
		let o = 1;
		let blur = (1 - u) * 16;
		if (i === 3) {
			const fly = pr(t, 3.22, 0.28, Ez.ie);
			s *= 1 + fly * 4;
			o = 1 - fly;
			blur += fly * 20;
		}
		T(el, { s, rz: tilt * (1 - u * 0.6), o, blur });
		rgbSplit(el, 18 * decay(t, t0, 9));
	});
}

function renderLogo(L, t, t0, isIntro) {
	const end = isIntro ? 4.62 : 99;
	if (t < t0 - 0.02 || t > end) {
		hide(L.root);
		if (L === R.logo) hide(R.ring);
		return;
	}
	const zoom = isIntro ? pr(t, TL.zoom, 0.36, Ez.ie) : 0;
	T(L.root, { o: 1 - pr(t, end - 0.12, 0.12, Ez.lin) });
	// zoom-through: scale around the mark
	T(L.group, { x: -L.markX * zoom * 0, s: 1 + zoom * 14, o: 1 });
	L.group.style.transformOrigin = `${L.markX}px 0px`;
	const mp = pr(t, t0, 0.5, (x) => Ez.ob(x, 1.9));
	T(L.mark, { s: mix(0.15, 1, mp), rz: (1 - mp) * -120, o: pr(t, t0, 0.08, Ez.lin) });
	const c1 = L.mark.querySelector(".c1");
	const c2 = L.mark.querySelector(".c2");
	c1.setAttribute("stroke-dashoffset", (36 * (1 - pr(t, t0 + 0.08, 0.28, Ez.oc))).toFixed(2));
	c2.setAttribute("stroke-dashoffset", (36 * (1 - pr(t, t0 + 0.16, 0.28, Ez.oc))).toFixed(2));
	L.chars.forEach((c, i) => {
		const u = pr(t, t0 + 0.1 + i * 0.028, 0.45, Ez.oe);
		c.style.transform = `translate3d(0,${((1 - u) * 110).toFixed(1)}%,0)`;
	});
	// light sweep
	const sw = pr(t, t0 + 0.45, 0.8, Ez.ioc);
	const pos = `${mix(100, 0, sw).toFixed(1)}% 0`;
	L.chars.forEach((c) => (c.style.backgroundPosition = pos));
	if (L.sub) {
		setText(L.sub, decode(L.subText, pr(t, t0 + 0.32, 0.42, Ez.lin), t, 11));
		T(L.sub, { o: pr(t, t0 + 0.3, 0.1, Ez.lin) * (1 - zoom) });
	}
	// ring shockwave
	if (L === R.logo || L === R.lock) {
		const ring = R.ring;
		const rp = cl((t - t0) / 0.7);
		if (rp > 0 && rp < 1) {
			ring.style.top = `${L === R.lock ? 430 : 540}px`;
			T(ring, { o: 1 });
			[...ring.children].forEach((r, k) => {
				const u = Ez.oc(cl(rp * (1 + k * 0.3) - k * 0.15));
				const rad = 60 + u * (700 + k * 300);
				Object.assign(r.style, {
					left: `${-rad + L.markX}px`,
					top: `${-rad}px`,
					width: `${rad * 2}px`,
					height: `${rad * 2}px`,
					opacity: ((1 - u) * 0.9).toFixed(3),
					borderWidth: `${(1 - u) * 6 + 1}px`,
					borderColor: k ? "#8b7cff" : "#34d1e6",
				});
			});
		} else if (t > t0 + 0.7) hide(ring);
	}
}

function renderAct3(t) {
	const f = TL.feats;
	const vis = t > f[0] - 0.1 && t < 13.6;
	if (!vis) {
		hide(R.heads);
		hide(R.panels);
		hide(R.rail);
		return;
	}
	const fadeAll = pr(t, 12.3, 0.25, Ez.ic);
	T(R.heads, { o: 1 - fadeAll, x: -fadeAll * 80 });
	T(R.rail, { o: pr(t, f[0] + 0.2, 0.3, Ez.lin) * (1 - fadeAll) });
	T(R.panels, {});
	// rail fill
	R.seg.forEach((s, i) => {
		const fill = cl((t - f[i]) / 2);
		s.querySelector("i").style.width = `${(fill * 100).toFixed(2)}%`;
		s.querySelector(".lb").style.color = t >= f[i] && t < f[i] + 2 ? "#e7ebf1" : "#5d6676";
	});
	// headlines
	R.hl.forEach((hl, i) => {
		const t0 = i === 0 ? f[0] + 0.05 : f[i];
		const tOut = i < 3 ? f[i] + 1.74 : 99;
		if (t < t0 - 0.01 || t > tOut + 0.36) return hide(hl);
		T(hl, {});
		const lines = hl.querySelectorAll(".ln > span");
		lines.forEach((ln, k) => {
			const uin = pr(t, t0 + 0.1 + k * 0.07, 0.5, Ez.oe);
			const uout = pr(t, tOut + k * 0.04, 0.22, Ez.ic);
			ln.style.transform = `translate3d(0,${((1 - uin) * 112 - uout * 112).toFixed(1)}%,0)`;
		});
		const idx = hl.querySelector(".idxt");
		setText(idx, decode(["PROPOSE", "VOTE", "PICK", "PLAY"][i], pr(t, t0, 0.3, Ez.lin), t, i));
		const sub = hl.querySelector(".sub");
		T(sub, { o: pr(t, t0 + 0.3, 0.35, Ez.oc) * (1 - pr(t, tOut - 0.05, 0.15, Ez.lin)), y: (1 - pr(t, t0 + 0.3, 0.5, Ez.oe)) * 24 });
		T(hl.querySelector(".idx"), { o: 1 - pr(t, tOut, 0.25, Ez.lin) });
	});
	// panels
	R.p.forEach((P, i) => {
		const t0 = f[i] - 0.05;
		const tOut = i < 3 ? f[i] + 1.84 : 99;
		const inU = pr(t, t0, 0.62, Ez.oe);
		const outU = pr(t, tOut, 0.42, Ez.ie);
		const local = t - f[i];
		// fan arrangement in act 4
		const fanIn = pr(t, TL.fanIn + i * 0.035, 0.5, Ez.oe);
		const coll = pr(t, TL.collapse, 0.2, Ez.ie);
		if (fanIn > 0) {
			const k = i - 1.5;
			const base = { x: 0, y: 0, z: 0, ry: -16, rx: 6, s: 1 };
			const fan = { x: -410 + k * 420, y: 60, z: -260 - Math.abs(k) * 150, ry: k * -22, rx: 4, s: 0.6 };
			const from = i === 3 ? base : { ...fan, x: fan.x + 600, z: fan.z - 900, ry: fan.ry - 40 };
			const u = fanIn;
			const spin = (t - TL.fanIn) * 6;
			renderPanel(i, P, 3);
			return T(P.el, {
				x: mix(from.x, fan.x, u) * (1 - coll),
				y: mix(from.y, fan.y, u) * (1 - coll),
				z: mix(from.z, fan.z, u) - coll * 1200,
				ry: mix(from.ry, fan.ry, u) + spin,
				rx: mix(from.rx, fan.rx, u),
				s: mix(from.s, fan.s, u) * (1 - coll * 0.7),
				o: (i === 3 ? 1 : cl(u * 2)) * (1 - coll),
				blur: coll * 10,
			});
		}
		if (t < t0 || outU >= 1) return hide(P.el);
		const float = Math.sin((t + i) * 1.3) * 8;
		T(P.el, {
			x: mix(560, 0, inU) - outU * 160,
			y: float - outU * 140,
			z: mix(-420, 0, inU) - outU * 1100,
			ry: mix(-58, -16, inU) - outU * 24 + noise1(t * 0.5 + i) * 2,
			rx: 6 + outU * 22 + noise1(t * 0.4 + 3 + i) * 1.5,
			o: cl(inU * 1.6) * (1 - outU),
			blur: (1 - inU) * 10 + outU * 8,
		});
		renderPanel(i, P, local);
	});
}

function renderPanel(i, P, u) {
	[renderP1, renderP2, renderP3, renderP4][i](P, u);
}

function renderP1(P, u) {
	const n = P1_QUERY.length;
	let typed = 0;
	for (let i = 0; i < n; i++) if (u >= P1_TYPE(i)) typed = i + 1;
	setText(P.q, P1_QUERY.slice(0, typed));
	P.ph.style.display = typed ? "none" : "";
	P.search.classList.toggle("focus", u > 0.12);
	P.caret.style.opacity = u > 0.12 && (u > 0.7 ? Math.floor(u * 4) % 2 === 0 : true) ? "1" : "0";
	P.chipEls.slice(0, 3).forEach((c, k) => {
		const on = u > 0.05 + k * 0.12;
		c.className = "chip" + (on ? [" on-v", " on-t", " on-b"][k] : "");
	});
	const cu = pr(u, 0.7, 0.45, Ez.oe);
	T(P.card, { o: cu, y: (1 - cu) * 40, s: mix(0.96, 1, cu) });
	P.stats.forEach((s, k) => {
		const su = pr(u, 0.9 + k * 0.1, 0.35, (x) => Ez.ob(x, 2));
		T(s, { s: mix(0.6, 1, su), o: cl(su * 2) });
	});
	const eu = pr(u, 1.18, 0.38, (x) => Ez.ob(x, 2.2));
	T(P.effort, { s: mix(0.2, 1, eu), o: cl(eu * 2), rz: (1 - eu) * -40 });
	setText(P.effn, String(Math.round(29 * pr(u, 1.2, 0.42, Ez.oq))));
	setText(P.form, decode("13 × 2.0 × 1.12 =", pr(u, 1.3, 0.35, Ez.lin), u + 7, 5));
}

function renderP2(P, u) {
	const done = VOTE_STEPS.filter((s) => u >= s.u);
	setText(P.vn, String(10 - done.length));
	P.rows.forEach((r, k) => {
		const mine = done.filter((s) => s.row === k).length;
		setText(r.n, String(mine));
		const hot = VOTE_STEPS.some((s) => s.row === k && u >= s.u && u < s.u + 0.08);
		r.plus.className = "p" + (hot ? " hot" : "");
		const ru = pr(u, 0.1 + k * 0.05, 0.4, Ez.oe);
		T(r.row, { o: ru, x: (1 - ru) * 60 });
		const w = r.row.querySelector(".tot i");
		w.style.width = `${((VOTE_ROWS[k].base + mine * 0.05) * 100 * pr(u, 0.15, 0.6, Ez.oc)).toFixed(2)}%`;
	});
	const lu = pr(u, 1.45, 0.3, (x) => Ez.ob(x, 2.4));
	T(P.lock, { s: mix(1.8, 1, lu), o: cl(lu * 3), rz: (1 - lu) * 10 });
}

function pickScore(g, u) {
	let s = 0;
	const prev = [0, ...g.s];
	for (let k = 0; k < 3; k++) s += (prev[k + 1] - prev[k]) * pr(u, PICK_STAGE[k], 0.3, Ez.oc);
	return s;
}
function pickRank(u) {
	// rank positions with smooth swaps after each factor lands
	const ord = (cut) =>
		PICK.map((g, i) => ({ i, v: cut < 0 ? g.s[0] : g.s[cut] }))
			.sort((a, b) => b.v - a.v)
			.map((x) => x.i);
	const stages = [
		[-1, 0],
		[1, PICK_STAGE[1] + 0.25],
		[2, PICK_STAGE[2] + 0.25],
	];
	const pos = new Array(PICK.length).fill(0);
	let base = ord(-1);
	base.forEach((gi, r) => (pos[gi] = r));
	for (let s = 1; s < stages.length; s++) {
		const next = ord(stages[s][0]);
		const w = pr(u, stages[s][1], 0.35, Ez.ioc);
		next.forEach((gi, r) => (pos[gi] = mix(pos[gi], r, w)));
	}
	return pos;
}
function renderP3(P, u) {
	const cu = pr(u, 0.05, 0.35, Ez.oe);
	T(P.ctx, { o: cu, y: (1 - cu) * 20 });
	P.legend.forEach((l, k) => (l.style.color = u > PICK_STAGE[k] ? "#e7ebf1" : "#5d6676"));
	const pos = pickRank(u);
	const win = pr(u, PICK_WIN, 0.35, (x) => Ez.ob(x, 2.2));
	P.rows.forEach((r, k) => {
		const s = pickScore(r.g, u);
		const prev = [0, ...r.g.s];
		r.segs.forEach((seg, j) => {
			const a = prev[j];
			const b = Math.min(prev[j + 1], Math.max(a, s));
			seg.style.left = `${a * 100}%`;
			seg.style.width = `${Math.max(0, b - a) * 100}%`;
		});
		setText(r.score, String(Math.round(s * 100)));
		const isWin = r.g.id === "gloom";
		const ru = pr(u, 0.12 + k * 0.05, 0.4, Ez.oe);
		T(r.row, {
			y: 150 + pos[k] * 122,
			x: (1 - ru) * 80,
			o: ru * (isWin ? 1 : 1 - 0.55 * pr(u, PICK_WIN, 0.3, Ez.lin)),
			s: isWin ? 1 + 0.035 * win : 1,
			z: isWin ? 30 * win : 0,
		});
		r.row.style.borderColor = isWin && u > PICK_WIN ? "#ffc94a" : "";
		r.row.style.boxShadow = isWin && u > PICK_WIN ? `0 0 ${(40 * win).toFixed(0)}px rgba(255,201,74,.35)` : "";
		if (r.badge) T(r.badge, { s: mix(2, 1, win), o: cl(win * 3), rz: (1 - win) * -12 });
	});
}

function renderP4(P, u) {
	P.cells.forEach((c) => {
		const cu = pr(u, 0.05 + (c.r + c.c) * 0.035, 0.3, (x) => Ez.ob(x, 2));
		const a = (c.v / 4) * 0.95;
		const best = c.v === 4 && u > 0.62;
		c.cell.style.background = `rgba(52,209,230,${(a * cl(cu)).toFixed(3)})`;
		c.cell.style.transform = `scale(${mix(0.4, 1, cu).toFixed(3)})`;
		c.cell.style.boxShadow = best ? "0 0 0 3px #ffc94a, 0 0 24px rgba(255,201,74,.55)" : "";
	});
	const tu = pr(u, 0.72, 0.45, Ez.oe);
	T(P.toast, { y: (1 - tu) * 120, o: tu });
	P.who.forEach((w, k) => T(w, { s: pr(u, 0.85 + k * 0.06, 0.25, (x) => Ez.ob(x, 2.5)) }));

	P.line.style.strokeDasharray = `${P.lineLen}`;
	P.line.style.strokeDashoffset = `${(P.lineLen * (1 - lu)).toFixed(2)}`;

	const pu = pr(u, 1.05, 0.4, Ez.oc);

	P.proj.style.opacity = pu > 0 ? "1" : "0";
	P.proj.setAttribute("stroke-dasharray", `${(P.projLen * pu).toFixed(1)} 9999`);
	P.proj.style.strokeDasharray = "";
	const fu = pr(u, 1.4, 0.3, (x) => Ez.ob(x, 2.5));
	P.flag.setAttribute("transform", `translate(${P.fin[0]},${P.fin[1]}) scale(${fu.toFixed(3)})`);

}

function renderAct4(t) {
	// kinds, hard cuts on 8th notes
	R.kd.forEach((el, i) => {
		const t0 = TL.kinds[i];

	});

// ------------------------------------------------------------------ background + fx canvases
let BGX = null;
let FXX = null;
let GRAIN = [];
const PARTS = Array.from({ length: 140 }, (_, i) => ({
	x: hsh(i * 1.3) * 1920,
	y: hsh(i * 2.7) * 1080,
	z: 0.3 + hsh(i * 4.1) * 1.4,
	r: 0.6 + hsh(i * 5.9) * 1.8,
	c: hsh(i * 7.3) < 0.7 ? "52,209,230" : "139,124,255",
}));

function initCanvases() {
	BGX = document.getElementById("bg").getContext("2d");
	FXX = document.getElementById("fx").getContext("2d");
	for (let k = 0; k < 4; k++) {
		const c = document.createElement("canvas");
		c.width = c.height = 256;
		const x = c.getContext("2d");
		const img = x.createImageData(256, 256);
		let s = 1234 + k * 999;
		for (let i = 0; i < img.data.length; i += 4) {
			s = (s * 1664525 + 1013904223) >>> 0;
			const v = s >>> 24;
			img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
			img.data[i + 3] = 255;
		}
		x.putImageData(img, 0, 0);
		GRAIN.push(x.createPattern(c, "repeat"));
	}
}

function beatPulse(t) {
	if (t < TL.feats[0] || t > 12.5) return 0;
	const b = Math.floor((t - TL.feats[0]) / RB);
	return decay(t, TL.feats[0] + b * RB, 7);
}

function renderBG(t) {
	const x = BGX;
	x.globalCompositeOperation = "source-over";
	x.fillStyle = "#05070a";
	x.fillRect(0, 0, 1920, 1080);
	const pulse = beatPulse(t);
	const act3 = pr(t, 4.4, 0.6, Ez.oc);
	const glow = (cx, cy, r, rgb, a) => {
		const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
		g.addColorStop(0, `rgba(${rgb},${a})`);
		g.addColorStop(1, `rgba(${rgb},0)`);
		x.fillStyle = g;
		x.fillRect(0, 0, 1920, 1080);
	};
	x.globalCompositeOperation = "lighter";
	glow(mix(960, 1380, act3) + Math.sin(t * 0.7) * 60, mix(520, 480, act3), 900, "52,209,230", 0.13 + 0.06 * pulse + 0.25 * decay(t, TL.hit, 3) + 0.25 * decay(t, TL.final, 3));
	glow(mix(300, 260, act3) + Math.cos(t * 0.5) * 80, 960, 1000, "139,124,255", 0.12 + 0.04 * pulse);
	glow(1700, 120, 700, "255,107,107", 0.03 * act3);
	// perspective floor grid
	const ga = 0.12 * act3 * (1 - pr(t, 13.3, 0.3, Ez.lin)) + 0.08 * pr(t, 13.6, 0.6, Ez.lin);
	if (ga > 0.005) {
		const hy = 640;
		x.strokeStyle = `rgba(52,209,230,${ga})`;
		x.lineWidth = 1;
		for (let k = -16; k <= 16; k++) {
			x.beginPath();
			x.moveTo(960 + k * 40, hy);
			x.lineTo(960 + k * 400, 1080);
			x.stroke();
		}
		const scroll = (t * 0.9) % 1;
		for (let k = 0; k < 14; k++) {
			const z = (k + 1 - scroll) / 14;
			const y = hy + Math.pow(z, 2.2) * (1080 - hy);
			x.globalAlpha = Math.pow(z, 0.8);
			x.beginPath();
			x.moveTo(0, y);
			x.lineTo(1920, y);
			x.stroke();
		}
		x.globalAlpha = 1;
	}
	// particles
	for (const p of PARTS) {
		const y = (((p.y - t * 40 * p.z) % 1080) + 1080) % 1080;
		const xx = p.x + Math.sin(t * 0.6 + p.y) * 20 * p.z;
		x.fillStyle = `rgba(${p.c},${(0.18 + 0.25 * pulse) * p.z * 0.6})`;
		x.beginPath();
		x.arc(xx, y, p.r * p.z, 0, Math.PI * 2);
		x.fill();
	}
	x.globalCompositeOperation = "source-over";
}

function renderFX(t) {
	const x = FXX;
	x.clearRect(0, 0, 1920, 1080);
	// vignette
	const v = x.createRadialGradient(960, 540, 420, 960, 540, 1150);
	v.addColorStop(0, "rgba(0,0,0,0)");
	v.addColorStop(1, "rgba(0,0,0,0.5)");
	x.fillStyle = v;
	x.fillRect(0, 0, 1920, 1080);
	// flashes on the two big hits
	const fl = Math.max(decay(t, TL.hit, 14) * 0.9, decay(t, TL.final, 14) * 0.75, decay(t, 0.02, 20) * 0.25);
	if (fl > 0.01) {
		x.fillStyle = `rgba(220,250,255,${fl})`;
		x.fillRect(0, 0, 1920, 1080);
	}
	// zoom-through dip to black between logo and features
	const dip = Math.min(pr(t, 4.4, 0.12, Ez.lin), 1 - pr(t, 4.52, 0.2, Ez.lin));
	if (dip > 0.01) {
		x.fillStyle = `rgba(5,7,10,${dip})`;
		x.fillRect(0, 0, 1920, 1080);
	}
	// film grain
	x.globalAlpha = 0.04;
	x.globalCompositeOperation = "overlay";
	x.fillStyle = GRAIN[Math.floor(t * 30) % 4];
	x.save();
	x.translate(Math.floor(hsh(Math.floor(t * 30)) * 256), Math.floor(hsh(Math.floor(t * 30) + 7) * 256));
	x.fillRect(-256, -256, 1920 + 512, 1080 + 512);
	x.restore();
	x.globalAlpha = 1;
	x.globalCompositeOperation = "source-over";
}

/*
 * Soundtrack for the NextQuest reel: a 120 BPM electronic cue plus UI sound
 * design, synthesized in JS (DSP helpers come from ../animation/src/audio.js)
 * and finished with reverb + bus compression in an OfflineAudioContext.
 */
"use strict";

const RA = {
	// chord per bar (bars are 4 beats = 2 s, starting on the feature cuts)
	act1: ["A3", "C4", "E4"],
	hitChord: ["C3", "G3", "C4", "E4", "G4", "D5"],
	bars: [
		[4.5, ["F2", "A3", "C4", "E4"]],
		[6.5, ["G2", "B3", "D4", "G4"]],
		[8.5, ["A2", "C4", "E4", "G4"]],
		[10.5, ["F2", "A3", "C4", "F4"]],
	],
	build: ["G2", "B3", "D4", "F4"],
	final: ["C2", "G3", "C4", "E4", "G4", "D5"],
};

// ------------------------------------------------------------------ synths
function supersaw(freq, dur, o = {}) {
	const x = buf(dur + (o.rel ?? 0.3));
	const det = [-0.14, -0.07, 0, 0.07, 0.14];
	det.forEach((d, i) => osc(x, "saw", freq * Math.pow(2, d / 12), 0.22, i * 731));
	filt(x, "lp", (t) => (o.cut ?? 3200) * (o.sweep ? 0.35 + 0.65 * Math.min(1, t / o.sweep) : 1), 0.9);
	filt(x, "hp", 120, 0.7);
	adsr(x, o.att ?? 0.01, o.dec ?? 0.25, o.sus ?? 0.6, o.rel ?? 0.3, dur);
	return x;
}
function subBass(freq, dur) {
	const x = buf(dur + 0.06);
	osc(x, "saw", freq, 0.25);
	for (let n = 0; n < x.length; n++) x[n] += Math.sin((2 * Math.PI * freq * n) / SR) * 0.9;
	filt(x, "lp", 420, 0.8);
	adsr(x, 0.006, 0.08, 0.85, 0.05, dur);
	return x;
}
function pluckSynth(freq, dur = 0.18) {
	const x = buf(dur + 0.2);
	osc(x, "saw", freq, 0.5);
	osc(x, "square", freq * 2.003, 0.18, 500);
	filt(x, "lp", (t) => 600 + 5200 * Math.exp(-t * 22), 1.4);
	adsr(x, 0.002, 0.12, 0.15, 0.12, dur);
	return x;
}
function blip(freq, dur = 0.05, gain = 1) {
	const x = buf(dur + 0.03);
	for (let n = 0; n < x.length; n++) {
		const t = n / SR;
		x[n] = Math.sin(2 * Math.PI * freq * t) * Math.exp(-t * 60) * gain;
	}
	return x;
}
function riser(sec, f0 = 300, f1 = 6000) {
	const x = noise(sec);
	filt(x, "bp", (t) => f0 * Math.pow(f1 / f0, t / sec), 1.2);
	let ph = 0;
	for (let n = 0; n < x.length; n++) {
		const t = n / SR;
		const u = t / sec;
		ph += (2 * Math.PI * (180 * Math.pow(7, u))) / SR;
		x[n] = (x[n] * 0.9 + Math.sin(ph) * 0.25) * Math.pow(u, 1.6);
	}
	return x;
}
function impact() {
	const x = kick({ f1: 140, f2: 34, decay: 2.4, len: 1.8 });
	const n = noise(1.2);
	filt(n, "lp", (t) => 6000 * Math.exp(-t * 6) + 150, 0.7);
	for (let k = 0; k < n.length; k++) x[k] += n[k] * 0.7 * Math.exp((-k / SR) * 5);
	return x;
}
function clap() {
	const x = snap();
	const s = snare({ decay: 22 });
	for (let n = 0; n < Math.min(x.length, s.length); n++) x[n] = x[n] * 0.8 + s[n] * 0.5;
	return x;
}

// ------------------------------------------------------------------ score + sfx
async function buildReelSoundtrack() {
	_seed = 777;
	const len = Math.ceil(REEL_DUR * SR);
	const bus = {
		pump: [new Float32Array(len), new Float32Array(len)],
		drums: [new Float32Array(len), new Float32Array(len)],
		sfx: [new Float32Array(len), new Float32Array(len)],
		rev: [new Float32Array(len), new Float32Array(len)],
	};
	const cache = new Map();
	function play(fn, when, which, gain = 1, pan = 0, rev = 0.15, key = null) {
		if (when < 0 || when >= REEL_DUR) return;
		let d;
		if (key && cache.has(key)) d = cache.get(key);
		else {
			d = fn();
			if (key) cache.set(key, d);
		}
		const a = ((pan + 1) * Math.PI) / 4;
		const gl = Math.cos(a) * gain;
		const gr = Math.sin(a) * gain;
		const [L, R2] = bus[which];
		const [RL, RR] = bus.rev;
		const s0 = Math.round(when * SR);
		const n = Math.min(d.length, len - s0);
		for (let k = 0; k < n; k++) {
			const v = d[k];
			L[s0 + k] += v * gl;
			R2[s0 + k] += v * gr;
			if (rev) {
				RL[s0 + k] += v * gl * rev;
				RR[s0 + k] += v * gr * rev;
			}
		}
	}
	const kicks = [];
	const K = (t, g = 0.9) => {
		kicks.push(t);
		play(() => kick({ f1: 160, f2: 48, decay: 8, len: 0.45 }), t, "drums", g, 0, 0.02, "k");
	};

	// ---------- act 1: tension
	play(() => kick({ f1: 120, f2: 40, decay: 5, len: 0.9 }), 0.0, "sfx", 0.5, 0, 0.2);
	play(() => whoosh(0.5, 3000, 300), 0.0, "sfx", 0.25, 0, 0.2);
	RA.act1.forEach((n, i) => play(() => supersaw(hz(n), 3.3, { att: 0.6, cut: 1400, sus: 0.8, rel: 0.2, sweep: 3 }), 0.05, "pump", 0.16, i - 1, 0.35, "pad1" + n));
	for (let b = 0; b < 12; b++) play(() => hat(55, 9000), 0.25 + b * 0.25, "drums", 0.08 + b * 0.008, 0.4, 0.05, "hat");
	// counter blips (one per value change bucket)
	for (let k = 0; k < 26; k++) {
		const u = k / 26;
		// invert the counter's ease-out so blips follow the digits
		const t = TL.count + 0.85 * (1 - Math.pow(1 - u, 1 / 5)) * 0.999;
		play(() => blip(1800 + k * 40, 0.04), t, "sfx", 0.18, 0.2, 0.05);
	}
	// word hits
	const stabs = [
		["A3", "C4", "E4"],
		["A3", "C4", "E4"],
		["F3", "A3", "C4"],
		["G3", "B3", "D4"],
	];
	TL.words.forEach((t, i) => {
		K(t, 1);
		play(() => clap(), t, "drums", 0.5, 0, 0.25, "clap");
		stabs[i].forEach((n, j) => play(() => supersaw(hz(n), 0.18, { cut: 5000, dec: 0.1, sus: 0.3, rel: 0.15 }), t, "pump", 0.2, j - 1, 0.3, "stab" + n));
		play(() => subBass(hz(stabs[i][0].replace("3", "1")), 0.4), t, "pump", 0.6, 0, 0, "sb" + i);
		play(() => whoosh(0.25, 2500, 400), t - 0.06, "sfx", 0.18, i % 2 ? 0.5 : -0.5, 0.1);
	});
	play(() => riser(0.5, 400, 9000), 3.0, "sfx", 0.5, 0, 0.2);
	play(() => revCymbal(0.6), 2.9, "sfx", 0.35, 0, 0.2);

	// ---------- act 2: logo hit
	play(() => impact(), TL.hit, "sfx", 1.25, 0, 0.25);
	play(() => crash(2.6), TL.hit, "drums", 0.35, 0.1, 0.3, "crash");
	RA.hitChord.forEach((n, i) => play(() => supersaw(hz(n), 0.8, { cut: 6000, dec: 0.5, sus: 0.4, rel: 0.6 }), TL.hit, "pump", 0.13, (i / 5) * 2 - 1, 0.45));
	play(() => sparkle(10, 84, 0.7), TL.hit + 0.08, "sfx", 0.4, 0, 0.45);
	for (let i = 0; i < 9; i++) play(() => blip(3200 + i * 220, 0.03), TL.hit + 0.32 + i * 0.045, "sfx", 0.06, 0.3, 0.05);
	// arpeggio pickup
	const arp = ["C4", "E4", "G4", "C5", "E5", "G5", "C6", "E6"];
	arp.forEach((n, i) => play(() => pluckSynth(hz(n)), 3.75 + i * 0.0625, "pump", 0.16, (i % 2 ? 0.4 : -0.4), 0.3, "pl" + n));
	play(() => whoosh(0.4, 400, 5000), TL.zoom - 0.05, "sfx", 0.45, 0, 0.2);
	play(() => revCymbal(0.45), TL.zoom - 0.05, "sfx", 0.25, 0, 0.2);

	// ---------- act 3: groove (bars on the feature cuts)
	for (const [t0, ch] of RA.bars) {
		for (let b = 0; b < 4; b++) {
			const t = t0 + b * RB;
			K(t);
			if (b % 2 === 1) play(() => clap(), t, "drums", 0.42, 0, 0.2, "clap");
			play(() => hat(18, 7000), t + RB / 2, "drums", 0.16, 0.35, 0.05, "ohat");
			for (let s = 0; s < 4; s++) if (s !== 2) play(() => hat(80, 9000), t + s * (RB / 4), "drums", 0.06 + (s % 2) * 0.03, -0.3, 0.02, "chat");
			// offbeat bass
			play(() => subBass(hz(ch[0]), 0.2), t + RB / 2, "pump", 0.42, 0, 0, "ob" + ch[0]);
			// 16th pluck arp over chord tones
			const tones = ch.slice(1).concat([ch[1].replace(/\d/, (d) => String(Number(d) + 1))]);
			for (let s = 0; s < 4; s++) {
				const n = tones[(b * 4 + s) % tones.length];
				play(() => pluckSynth(hz(n)), t + s * (RB / 4), "pump", 0.11, s % 2 ? 0.35 : -0.35, 0.25, "pl" + n);
			}
		}
		ch.slice(1).forEach((n, i) => play(() => supersaw(hz(n), 1.9, { att: 0.05, cut: 2600, sus: 0.7, rel: 0.2 }), t0, "pump", 0.11, i - 1, 0.35, "pad" + n));
		play(() => subBass(hz(ch[0].replace("2", "1")), 1.9), t0, "pump", 0.16, 0, 0, "sub" + ch[0]);
		if (t0 > TL.feats[0]) {
			play(() => whoosh(0.45, 300, 4000), t0 - 0.28, "sfx", 0.4, 0.3, 0.15);
			play(() => crash(1.2), t0, "drums", 0.12, -0.2, 0.3, "crash12");
		}
	}
	// UI sound design (times mirror reel.js)
	const f = TL.feats;
	for (let i = 0; i < P1_QUERY.length; i++) play(() => clickSfx(2200 + ((i * 397) % 1200)), f[0] + P1_TYPE(i), "sfx", 0.22, 0.3, 0.02);
	play(() => pop(520, 0.12), f[0] + 0.7, "sfx", 0.25, 0.3, 0.1);
	[0.9, 1.0, 1.1].forEach((u, k) => play(() => blip(1100 + k * 330, 0.06), f[0] + u, "sfx", 0.28, 0.4, 0.12));
	play(() => pop(260, 0.18), f[0] + 1.18, "sfx", 0.35, 0.4, 0.1);
	for (let k = 0; k < 12; k++) play(() => blip(2400 + k * 60, 0.025), f[0] + 1.2 + 0.42 * (1 - Math.pow(1 - k / 12, 1 / 5)), "sfx", 0.1, 0.4, 0.02);
	VOTE_STEPS.forEach((s, k) => play(() => blip(900 + k * 90, 0.07), f[1] + s.u, "sfx", 0.3, 0.35, 0.1));
	play(() => {
		const x = clickSfx(1500);
		const y = kick({ f1: 300, f2: 120, decay: 30, len: 0.15 });
		for (let n = 0; n < x.length; n++) y[n] += x[n];
		return y;
	}, f[1] + 1.45, "sfx", 0.55, 0.4, 0.1);
	PICK_STAGE.forEach((u, k) => play(() => whoosh(0.32, 600 + k * 400, 3000 + k * 600), f[2] + u, "sfx", 0.16, 0.4, 0.1));
	[PICK_STAGE[1] + 0.25, PICK_STAGE[2] + 0.25].forEach((u) => play(() => swish(0.3, 1800), f[2] + u, "sfx", 0.25, 0.3, 0.1));
	["C6", "E6", "G6", "C7"].forEach((n, k) => play(() => mallet(hz(n), 0.2, GLOCK), f[2] + PICK_WIN + k * 0.05, "sfx", 0.2, 0.3, 0.35));
	for (let k = 0; k < 9; k++) play(() => blip(mtof(72 + [0, 2, 4, 7, 9, 12, 14, 16, 19][k]), 0.05), f[3] + 0.05 + k * 0.06, "sfx", 0.14, -0.2 + k * 0.08, 0.15);
	play(() => pop(700, 0.12), f[3] + 0.72, "sfx", 0.28, -0.2, 0.1);
	play(() => {
		const x = buf(0.75);
		let ph = 0;
		for (let n = 0; n < x.length; n++) {
			const t = n / SR;
			ph += (2 * Math.PI * (500 + 1300 * (t / 0.75))) / SR;
			x[n] = Math.sin(ph) * 0.3 * Math.min(1, t / 0.05) * Math.min(1, (0.75 - t) / 0.1);
		}
		return x;
	}, f[3] + 0.45, "sfx", 0.18, 0.4, 0.2);
	play(() => mallet(hz("G6"), 0.3, GLOCK), f[3] + 1.4, "sfx", 0.25, 0.4, 0.4);

	// ---------- act 4: build + final
	play(() => whoosh(0.55, 250, 3500), TL.fanIn - 0.05, "sfx", 0.45, 0, 0.2);
	RA.build.slice(1).forEach((n, i) => play(() => supersaw(hz(n), 1.0, { att: 0.02, cut: 1500, sus: 0.8, rel: 0.05, sweep: 1 }), 12.5, "pump", 0.13, i - 1, 0.3));
	TL.kinds.forEach((t, i) => {
		K(t, 0.9);
		play(() => clap(), t, "drums", 0.3 + i * 0.06, 0, 0.2, "clap");
		play(() => subBass(hz(RA.build[0]), 0.2), t, "pump", 0.5, 0, 0, "bsub");
	});
	for (let k = 0; k < 16; k++) play(() => snare({ decay: 30 }), 12.5 + k * 0.0625, "drums", 0.05 + (k / 16) * 0.2, 0.1, 0.1, "roll");
	play(() => riser(1.0, 300, 10000), 12.5, "sfx", 0.45, 0, 0.2);
	play(() => revCymbal(0.7), TL.final - 0.7, "sfx", 0.3, 0, 0.2);
	play(() => impact(), TL.final, "sfx", 1.3, 0, 0.3);
	play(() => crash(2.6), TL.final, "drums", 0.4, -0.1, 0.35, "crash");
	K(TL.final, 1);
	RA.final.forEach((n, i) => play(() => supersaw(hz(n), 1.2, { att: 0.005, cut: 5200, dec: 0.6, sus: 0.45, rel: 0.4 }), TL.final, "pump", 0.13, (i / 5) * 2 - 1, 0.5));
	play(() => subBass(hz("C1"), 1.2), TL.final, "pump", 0.6, 0, 0);
	play(() => sparkle(12, 84, 0.9), TL.final + 0.06, "sfx", 0.4, 0, 0.5);
	[14.15, 14.35].forEach((t) => {
		for (let k = 0; k < 8; k++) play(() => blip(4000 + k * 120, 0.02), t + k * 0.05, "sfx", 0.05, 0.2, 0.05);
	});

	// ---------- sidechain pump on pads/bass/arps
	const [PL, PR] = bus.pump;
	kicks.sort((a, b) => a - b);
	let ki = 0;
	for (let n = 0; n < len; n++) {
		const t = n / SR;
		while (ki + 1 < kicks.length && kicks[ki + 1] <= t) ki++;
		const since = kicks.length && t >= kicks[ki] ? t - kicks[ki] : 9;
		const g = 0.3 + 0.7 * (1 - Math.exp(-since / 0.085));
		PL[n] *= g;
		PR[n] *= g;
	}

	// ---------- drop-outs: a beat of near-silence before each big impact
	for (const hit of [TL.hit, TL.final]) {
		const a = Math.floor((hit - 0.075) * SR);
		const b = Math.floor((hit - 0.005) * SR);
		for (const k of ["pump", "drums", "sfx", "rev"])
			for (const ch of bus[k])
				for (let n = a - 240; n < b; n++) {
					const g = n < a ? 1 - (n - (a - 240)) / 240 : 0.04;
					ch[n] *= g;
				}
	}

	// ---------- graph: reverb, glue compression, master
	const ctx = new OfflineAudioContext(2, len, SR);
	const master = ctx.createGain();
	const comp = ctx.createDynamicsCompressor();
	comp.threshold.value = -12;
	comp.knee.value = 8;
	comp.ratio.value = 2.5;
	comp.attack.value = 0.004;
	comp.release.value = 0.12;
	const hpf = ctx.createBiquadFilter();
	hpf.type = "highpass";
	hpf.frequency.value = 30;
	master.connect(hpf);
	hpf.connect(comp);
	comp.connect(ctx.destination);
	const reverb = ctx.createConvolver();
	reverb.buffer = makeIR(ctx, 1.8);
	const rg = ctx.createGain();
	rg.gain.value = 0.3;
	reverb.connect(rg);
	rg.connect(master);
	const src = (arrs, dest, gain) => {
		const b = ctx.createBuffer(2, len, SR);
		b.copyToChannel(arrs[0], 0);
		b.copyToChannel(arrs[1], 1);
		const s = ctx.createBufferSource();
		s.buffer = b;
		const g = ctx.createGain();
		g.gain.value = gain;
		s.connect(g);
		g.connect(dest);
		s.start(0);
	};
	src(bus.pump, master, 0.8);
	src(bus.drums, master, 0.85);
	src(bus.sfx, master, 0.75);
	src(bus.rev, reverb, 1);
	const out = await ctx.startRendering();
	const L = out.getChannelData(0);
	const Rr = out.getChannelData(1);
	let pk = 0;
	for (let n = 0; n < L.length; n++) pk = Math.max(pk, Math.abs(L[n]), Math.abs(Rr[n]));
	const g = pk > 0 ? 0.89 / pk : 1;
	const fade = Math.floor((REEL_DUR - 0.5) * SR);
	for (let n = 0; n < L.length; n++) {
		const ff = n > fade ? Math.max(0, 1 - (n - fade) / (L.length - fade)) : 1;
		L[n] *= g * ff;
		Rr[n] *= g * ff;
	}
	return out;
}

/* Player shell for the reel + hooks for the frame exporter (window.REEL). */
"use strict";

(function () {
	const vp = document.getElementById("viewport");
	const stage = document.getElementById("stage");
	const btn = document.getElementById("play");
	const scrub = document.getElementById("scrub");
	const fill = document.getElementById("scrubFill");
	const time = document.getElementById("time");
	const exportMode = /[?&]export\b/.test(location.search);
	if (exportMode) {
		vp.classList.add("export");
		document.body.classList.add("export");
	}

	function fit() {
		const s = exportMode ? 1 : vp.clientWidth / 1920;
		stage.style.transform = `scale(${s})`;
	}
	window.addEventListener("resize", fit);
	fit();

	let actx = null;
	let src = null;
	let playing = false;
	let startAt = 0;
	let pausedT = 0;
	let raf = 0;
	let audio = null;

	const ready = (async () => {
		await Promise.all([
			document.fonts.load("800 100px 'Unbounded'"),
			document.fonts.load("600 20px 'Geist'"),
			document.fonts.load("500 20px 'Geist Mono'"),
		]);
		buildReel();
		initCanvases();
		layoutReel();
		render(14.9);
		if (!exportMode) audio = await buildReelSoundtrack();
	})();

	const now = () => (playing ? Math.min(REEL_DUR, actx.currentTime - startAt) : pausedT);
	function tick() {
		const t = now();
		render(t);
		fill.style.width = `${(t / REEL_DUR) * 100}%`;
		time.textContent = `${t.toFixed(1)} / ${REEL_DUR.toFixed(1)}`;
		if (playing && t >= REEL_DUR) return stop(REEL_DUR);
		if (playing) raf = requestAnimationFrame(tick);
	}
	function start(from) {
		actx ??= new AudioContext();
		if (actx.state === "suspended") actx.resume();
		if (src) src.stop();
		src = actx.createBufferSource();
		src.buffer = audio;
		src.connect(actx.destination);
		const t0 = actx.currentTime + 0.05;
		src.start(t0, from);
		startAt = t0 - from;
		playing = true;
		btn.textContent = "PAUSE";
		cancelAnimationFrame(raf);
		raf = requestAnimationFrame(tick);
	}
	function stop(at) {
		pausedT = at ?? now();
		playing = false;
		btn.textContent = pausedT >= REEL_DUR ? "REPLAY" : "PLAY WITH SOUND";
		if (src) {
			src.stop();
			src = null;
		}
		cancelAnimationFrame(raf);
		tick();
	}
	async function toggle() {
		if (playing) return stop();
		btn.textContent = "LOADING…";
		await ready;
		start(pausedT >= REEL_DUR - 0.05 ? 0 : pausedT);
	}
	btn.addEventListener("click", toggle);
	scrub.addEventListener("click", async (e) => {
		await ready;
		const r = scrub.getBoundingClientRect();
		const t = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * REEL_DUR;
		if (playing) start(t);
		else {
			pausedT = t;
			tick();
		}
	});
	window.addEventListener("keydown", (e) => {
		if (e.code === "Space") {
			e.preventDefault();
			toggle();
		}
	});

	window.REEL = {
		ready,
		duration: REEL_DUR,
		frame(t) {
			render(t);
		},
		async wavBase64() {
			const ab = await buildReelSoundtrack();
			const u = new Uint8Array(encodeWav(ab));
			let s = "";
			for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
			return btoa(s);
		},
	};
})();

</script>
