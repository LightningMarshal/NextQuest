<style>
:root {
	--ink: #06080b;
	--surface: #12151b;
	--surface-2: #1a1f27;
	--line: #262d38;
	--fg: #e7ebf1;
	--dim: #8a93a3;
	--cyan: #34d1e6;
	--violet: #8b7cff;
	--green: #3fcf8e;
	--amber: #ffc94a;
	--coral: #ff6b6b;
	--page: #0b0d11;
	--page-fg: #e7ebf1;
	--page-dim: #8a93a3;
	color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
	background: var(--page);
	color: var(--page-fg);
	font-family: 'Hanken Grotesk', system-ui, sans-serif;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 14px;
	padding: 16px;
	overflow-x: hidden;
}
#viewport {
	position: relative;
	width: min(100%, calc((100vh - 110px) * 16 / 9));
	aspect-ratio: 16 / 9;
	max-width: 100%;
	overflow: hidden;
	border-radius: 12px;
	background: var(--ink);
	box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}
body.export { padding: 0; display: block; overflow: hidden; }
#viewport.export { width: 1920px; height: 1080px; border-radius: 0; box-shadow: none; aspect-ratio: auto; }
#stage {
	position: absolute;
	left: 0;
	top: 0;
	width: 1920px;
	height: 1080px;
	transform-origin: 0 0;
	overflow: hidden;
	background: var(--ink);
	perspective: 1700px;
	perspective-origin: 50% 46%;
	font-family: 'Hanken Grotesk', system-ui, sans-serif;
	color: var(--fg);
	contain: strict;
}
#stage canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
#fx { pointer-events: none; }
.abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; transform-style: preserve-3d; }
#world { position: absolute; inset: 0; transform-style: flat; perspective: 1700px; perspective-origin: 960px 500px; }

/* ---------- act 1: the wall of games */
#wallWrap { left: 960px; top: 540px; width: 0; height: 0; }
#wall { left: -1260px; top: -1600px; width: 2520px; display: grid; grid-template-columns: repeat(8, 302px); gap: 14px; }
.tile {
	height: 250px;
	border-radius: 14px;
	position: relative;
	overflow: hidden;
	border: 1px solid rgba(255, 255, 255, 0.07);
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}
.art { position: absolute; inset: 0; }
.tile .t { position: absolute; left: 12px; right: 12px; bottom: 30px; font: 700 17px/1.1 'Hanken Grotesk', sans-serif; color: #fff; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6); }
.tile .k { position: absolute; left: 12px; bottom: 10px; font: 600 10px 'JetBrains Mono', monospace; letter-spacing: 0.08em; padding: 2px 6px; border-radius: 4px; background: rgba(0, 0, 0, 0.45); color: #fff; }
#laser { left: 0; top: 539px; width: 1920px; height: 2px; background: linear-gradient(90deg, transparent, var(--cyan) 20%, #fff 50%, var(--cyan) 80%, transparent); box-shadow: 0 0 18px var(--cyan), 0 0 50px rgba(52, 209, 230, 0.6); }
#count { left: 960px; top: 540px; width: 0; height: 0; }
#countNum { position: absolute; left: -700px; width: 1400px; top: -230px; text-align: center; font: 900 300px/1 'Unbounded', sans-serif; letter-spacing: -0.04em; color: #fff; font-variant-numeric: tabular-nums; }
#countLbl { position: absolute; left: -700px; width: 1400px; top: 110px; text-align: center; font: 500 30px 'JetBrains Mono', monospace; letter-spacing: 0.32em; color: var(--dim); }
#words { left: 960px; top: 540px; width: 0; height: 0; }
.kw { position: absolute; left: -900px; width: 1800px; top: -130px; text-align: center; font: 900 220px/1.1 'Unbounded', sans-serif; letter-spacing: -0.035em; color: #fff; white-space: nowrap; }
.kw.cy { color: var(--cyan); }

/* ---------- logo */
.mark { position: absolute; border-radius: 24%; background: linear-gradient(145deg, #1b2029, #0b0d11 70%); border: 2px solid rgba(255, 255, 255, 0.09); box-shadow: 0 0 0 1px rgba(52, 209, 230, 0.15), 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08); }
.mark svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.wm { position: absolute; white-space: nowrap; font: 800 150px/1 'Unbounded', sans-serif; letter-spacing: -0.04em; }
.wm span { display: inline-block; }
.wm .n { background: linear-gradient(100deg, #e7ebf1 0%, #e7ebf1 42%, #ffffff 50%, #e7ebf1 58%, #e7ebf1 100%); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
.wm .q { background: linear-gradient(100deg, #34d1e6 0%, #34d1e6 42%, #c8f6fc 50%, #34d1e6 58%, #8b7cff 100%); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
.mask { overflow: hidden; display: inline-block; vertical-align: top; padding-bottom: 0.08em; }
.wd { display: inline-block; }
#ring { left: 960px; top: 540px; width: 0; height: 0; }
#ring i { position: absolute; border-radius: 50%; border: 3px solid var(--cyan); }
.mono { font-family: 'JetBrains Mono', monospace; }

/* ---------- act 3: feature panels */
#heads { left: 150px; top: 250px; width: 700px; height: 560px; }
.hl { position: absolute; left: 0; top: 0; width: 760px; }
.hl .idx { font: 600 24px 'JetBrains Mono', monospace; letter-spacing: 0.24em; color: var(--cyan); display: flex; gap: 16px; align-items: center; }
.hl .idx b { color: var(--fg); font-weight: 600; }
.hl .idx::after { content: ""; width: 120px; height: 2px; background: linear-gradient(90deg, var(--cyan), transparent); }
.hl .big { margin-top: 26px; font: 800 84px/1.04 'Unbounded', sans-serif; letter-spacing: -0.045em; color: #fff; }
.hl .big .ln { display: block; overflow: hidden; padding-bottom: 6px; }
.hl .big .ln > span { display: inline-block; }

<script>
/*
 * Soundtrack for the NextQuest promo: an original score, foley and the mix,
 * all synthesized in JavaScript and rendered with an OfflineAudioContext.
 *
 * Score: F major, 100 BPM (0.6 s/beat). Beat numbers below are absolute
 * (beat b starts at b * 0.6 s), so musical hits line up with scenes.js cues.
 */
"use strict";

const SR = 48000;
const BEAT = 0.6;
const bt = (b) => b * BEAT;

// ------------------------------------------------------------------ pitch
const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function midi(name) {
	const m = /^([A-G])(#|b)?(-?\d)$/.exec(name);
	let n = NOTE_IDX[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
	return n + (parseInt(m[3], 10) + 1) * 12;
}
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
const hz = (name) => mtof(midi(name));

// deterministic noise so every render is identical
let _seed = 1;
function nrand() {
	_seed = (_seed * 1664525 + 1013904223) >>> 0;
	return _seed / 4294967296 * 2 - 1;
}

// ------------------------------------------------------------------ DSP helpers
function biquadCoefs(type, f, Q, gainDb = 0) {
	const w0 = (2 * Math.PI * Math.min(f, SR * 0.45)) / SR;
	const cw = Math.cos(w0);
	const sw = Math.sin(w0);
	const alpha = sw / (2 * Q);
	const A = Math.pow(10, gainDb / 40);
	let b0, b1, b2, a0, a1, a2;
	switch (type) {
		case "lp":
			b0 = (1 - cw) / 2; b1 = 1 - cw; b2 = (1 - cw) / 2; a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha;
			break;
		case "hp":
			b0 = (1 + cw) / 2; b1 = -(1 + cw); b2 = (1 + cw) / 2; a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha;
			break;
		case "bp":
			b0 = alpha; b1 = 0; b2 = -alpha; a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha;
			break;
		case "peak":
			b0 = 1 + alpha * A; b1 = -2 * cw; b2 = 1 - alpha * A; a0 = 1 + alpha / A; a1 = -2 * cw; a2 = 1 - alpha / A;
			break;
	}
	return [b0 / a0, b1 / a0, b2 / a0, a1 / a0, a2 / a0];
}

/** Filter in place. `f` may be a number or a function of time (seconds) for sweeps. */
function filt(x, type, f, Q = 0.707, gainDb = 0) {
	let c = biquadCoefs(type, typeof f === "function" ? f(0) : f, Q, gainDb);
	let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
	for (let n = 0; n < x.length; n++) {
		if (typeof f === "function" && (n & 63) === 0) c = biquadCoefs(type, f(n / SR), Q, gainDb);
		const xn = x[n];
		const y = c[0] * xn + c[1] * x1 + c[2] * x2 - c[3] * y1 - c[4] * y2;
		x2 = x1; x1 = xn; y2 = y1; y1 = y;
		x[n] = y;
	}
	return x;
}

function buf(sec) {
	return new Float32Array(Math.max(1, Math.ceil(sec * SR)));
}

/** Attack/decay envelope multiply in place. */
function adsr(x, a, d, s, r, holdSec) {
	const A = a * SR, D = d * SR, H = holdSec * SR, R = r * SR;
	for (let n = 0; n < x.length; n++) {
		let e;
		if (n < A) e = n / A;
		else if (n < A + D) e = 1 - (1 - s) * ((n - A) / D);
		else if (n < H) e = s;
		else e = s * Math.max(0, 1 - (n - H) / R);
		x[n] *= e;
	}
	return x;
}

function fadeOut(x, sec = 0.01) {
	const N = Math.min(x.length, Math.floor(sec * SR));
	for (let k = 0; k < N; k++) x[x.length - 1 - k] *= k / N;
	return x;
}

// wavetables (band-limited) -------------------------------------------------
const TABLE_N = 4096;
const tableCache = new Map();
function table(kind, nh) {
	const key = kind + nh;
	if (tableCache.has(key)) return tableCache.get(key);
	const t = new Float32Array(TABLE_N + 1);
	for (let h = 1; h <= nh; h++) {
		let a = 0;
		if (kind === "saw") a = 1 / h;
		else if (kind === "square") a = h % 2 ? 1 / h : 0;
		else if (kind === "reed") a = h % 2 ? 1 / h : 0.35 / h;
		else if (kind === "brass") a = 1 / Math.pow(h, 0.9);
		if (!a) continue;
		for (let n = 0; n < TABLE_N; n++) t[n] += a * Math.sin((2 * Math.PI * h * n) / TABLE_N);
	}
	let mx = 0;
	for (let n = 0; n < TABLE_N; n++) mx = Math.max(mx, Math.abs(t[n]));
	for (let n = 0; n < TABLE_N; n++) t[n] /= mx;
	t[TABLE_N] = t[0];
	tableCache.set(key, t);
	return t;
}
function osc(x, kind, freqFn, gain = 1, phase0 = 0) {
	const f0 = typeof freqFn === "function" ? freqFn(0) : freqFn;
	const nh = Math.max(1, Math.min(60, Math.floor(15000 / Math.max(20, f0))));
	const t = table(kind, nh);
	let ph = phase0;
	for (let n = 0; n < x.length; n++) {
		const f = typeof freqFn === "function" ? freqFn(n / SR) : freqFn;
		ph += (f / SR) * TABLE_N;
		if (ph >= TABLE_N) ph -= TABLE_N * Math.floor(ph / TABLE_N);
		const i = ph | 0;
		const fr = ph - i;
		x[n] += gain * (t[i] + (t[i + 1] - t[i]) * fr);
	}
	return x;
}

// ------------------------------------------------------------------ instruments
/** Karplus-Strong plucked string with allpass tuning. */
function pluck(freq, dur, o = {}) {
	const x = buf(dur + (o.ring ?? 0.4));
	const P = SR / freq;
	const L = Math.max(2, Math.floor(P - 0.5 - 0.1));
	const d = P - 0.5 - L;
	const C = (1 - d) / (1 + d);
	const line = new Float32Array(L);
	// excitation: filtered noise burst (brightness) with pluck-position comb
	let lp = 0;
	const br = o.bright ?? 0.5;
	for (let k = 0; k < L; k++) {
		lp += (nrand() - lp) * (0.15 + br * 0.8);
		line[k] = lp;
	}
	let mean = 0;
	for (let k = 0; k < L; k++) mean += line[k];
	mean /= L;
	for (let k = 0; k < L; k++) line[k] -= mean;
	const pos = Math.max(1, Math.floor(L * (o.pos ?? 0.18)));
	const tmp = Float32Array.from(line);
	for (let k = 0; k < L; k++) line[k] = tmp[k] - tmp[(k + pos) % L] * 0.7;
	const decay = o.decay ?? 0.996;
	let idx = 0;
	let prev = 0;
	let apx = 0;
	let apy = 0;
	const damp = o.damp ?? 0.5;
	const holdN = Math.floor(dur * SR);
	for (let n = 0; n < x.length; n++) {
		const out = line[idx];
		const avg = damp * out + (1 - damp) * prev;
		prev = out;
		const ap = C * avg + apx - C * apy;
		apx = avg;
		apy = ap;
		// faster decay after release (palm mute)
		const dk = n < holdN ? decay : decay * 0.985;
		line[idx] = ap * dk;
		x[n] = out;
		idx = idx + 1 === L ? 0 : idx + 1;
	}
	fadeOut(x, 0.02);
	return x;
}

/** Struck-bar mallet percussion via additive partials. */
function mallet(freq, dur, partials, o = {}) {
	const len = dur + Math.max(...partials.map((p) => p[2])) * 3;
	const x = buf(Math.min(len, o.maxLen ?? 4));
	for (const [ratio, amp, dec] of partials) {
		const f = freq * ratio;
		if (f > 18000) continue;
		const w = (2 * Math.PI * f) / SR;
		const k = Math.exp(-1 / (dec * SR));
		let e = amp;
		// recursive sine oscillator (cheap)
		let s1 = Math.sin(w * -1);
		let s0 = 0;
		const c = 2 * Math.cos(w);
		for (let n = 0; n < x.length; n++) {
			const s = c * s0 - s1;
			s1 = s0;
			s0 = s;
			x[n] += s1 * e;
			e *= k;
		}
	}
	// soft attack + mallet click
	const A = Math.floor((o.attack ?? 0.002) * SR);
	for (let n = 0; n < A; n++) x[n] *= n / A;
	const clickN = Math.floor(0.004 * SR);
	for (let n = 0; n < clickN; n++) x[n] += nrand() * 0.25 * (1 - n / clickN) * (o.click ?? 1);
	fadeOut(x, 0.03);
	return x;
}
const GLOCK = [
	[1, 1, 1.4],
	[2.756, 0.38, 0.35],
	[5.404, 0.18, 0.12],
	[8.933, 0.07, 0.05],
];
const CELESTA = [
	[1, 1, 1.0],
	[2, 0.22, 0.45],
	[3, 0.1, 0.2],
	[4.2, 0.05, 0.1],
];
const MARIMBA = [
	[1, 1, 0.55],
	[3.93, 0.3, 0.12],
	[9.2, 0.08, 0.04],
];
const TRIANGLE = [
	[1, 1, 1.4],
	[2.41, 0.5, 1.0],
	[3.87, 0.35, 0.7],
	[5.3, 0.2, 0.4],
];

function tuba(freq, dur, o = {}) {
	const x = buf(dur + 0.25);
	const bend = o.bend ?? 0;
	osc(x, "brass", (t) => freq * Math.pow(2, (bend * Math.min(1, t / (o.bendT ?? 0.4))) / 12) * (1 + 0.004 * Math.sin(2 * Math.PI * 5 * t)));
	filt(x, "lp", (t) => 250 + 1200 * Math.exp(-t * 6) + (o.bright ?? 0), 0.8);
	adsr(x, 0.035, 0.15, 0.7, 0.15, dur);
	return x;
}

function reed(freq, dur, o = {}) {
	const x = buf(dur + 0.12);
	osc(x, "reed", (t) => freq * (1 + 0.003 * Math.sin(2 * Math.PI * 5.5 * t)));
	filt(x, "lp", 900 + (o.bright ?? 0), 0.9);
	adsr(x, 0.018, 0.08, 0.6, 0.08, dur);
	return x;
}

function strings(freq, dur, o = {}) {
	const x = buf(dur + 0.6);
	const det = [-0.08, -0.03, 0.03, 0.08];
	det.forEach((d, i) => osc(x, "saw", (t) => freq * Math.pow(2, d / 12) * (1 + 0.003 * Math.sin(2 * Math.PI * (4.6 + i * 0.3) * t + i)), 0.25, i * 900));
	filt(x, "lp", o.cut ?? 2600, 0.7);
	filt(x, "hp", 180, 0.7);
	adsr(x, o.attack ?? 0.35, 0.2, 0.85, 0.5, dur);
	return x;
}

function brassHit(freq, dur) {
	const x = buf(dur + 0.4);
	osc(x, "brass", (t) => freq * (1 + 0.003 * Math.sin(2 * Math.PI * 5 * t)), 0.6);
	osc(x, "brass", freq * 1.004, 0.4, 1000);
	filt(x, "lp", (t) => 900 + 3500 * Math.exp(-t * 5), 0.9);
	adsr(x, 0.02, 0.25, 0.55, 0.35, dur);
	return x;
}

// drums ---------------------------------------------------------------------
function kick(o = {}) {
	const x = buf(o.len ?? 0.5);
	let ph = 0;
	const f1 = o.f1 ?? 150;
	const f2 = o.f2 ?? 46;
	for (let n = 0; n < x.length; n++) {
		const t = n / SR;
		const f = f2 + (f1 - f2) * Math.exp(-t * 28);
		ph += (2 * Math.PI * f) / SR;
		x[n] = Math.sin(ph) * Math.exp(-t * (o.decay ?? 7));
	}
	for (let n = 0; n < 200; n++) x[n] += nrand() * 0.3 * (1 - n / 200);
	return x;
}
function snare(o = {}) {
	const x = buf(0.3);
	for (let n = 0; n < x.length; n++) x[n] = nrand() * Math.exp((-n / SR) * (o.decay ?? 18));
	filt(x, "bp", 2200, 0.6);
	const tone = buf(0.3);
	osc(tone, "saw", 190, 0);
	for (let n = 0; n < tone.length; n++) x[n] += Math.sin((2 * Math.PI * 185 * n) / SR) * 0.5 * Math.exp((-n / SR) * 30);
	return x;
}
function hat(decay = 60, f = 8000) {
	const x = buf(0.2);
	for (let n = 0; n < x.length; n++) x[n] = nrand() * Math.exp((-n / SR) * decay);
	filt(x, "hp", f, 0.7);
	return x;
}
function shaker() {
	const x = buf(0.14);
	for (let n = 0; n < x.length; n++) {
		const t = n / SR;
		x[n] = nrand() * Math.min(1, t / 0.012) * Math.exp(-t * 32);
	}
	filt(x, "hp", 5200, 0.7);
	return x;
}
function snap() {
	const x = buf(0.18);
	for (const off of [0, 0.009, 0.019]) {
		const s = Math.floor(off * SR);
		for (let n = s; n < x.length; n++) x[n] += nrand() * Math.exp(((-(n - s)) / SR) * (off === 0.019 ? 26 : 120));
	}
	filt(x, "bp", 1500, 0.9);
	return x;
}
function woodblock(f = 900) {
	const x = mallet(f, 0.05, [
		[1, 1, 0.05],
		[1.72, 0.4, 0.03],
	]);
	return x;
}
function crash(len = 2.4) {
	const x = buf(len);
	for (let n = 0; n < x.length; n++) {
		const t = n / SR;
		x[n] = nrand() * (Math.exp(-t * 1.6) * 0.8 + Math.exp(-t * 12) * 0.5);
	}
	filt(x, "hp", 4200, 0.6);
	filt(x, "peak", 7000, 1, 4);
	return x;
}
function revCymbal(len = 0.9) {
	const c = crash(len);
	c.reverse();
	for (let n = 0; n < c.length; n++) c[n] *= n / c.length;
	return c;
}
function timpani(f = 87) {
	const x = buf(1.4);
	for (let n = 0; n < x.length; n++) {
		const t = n / SR;
		const fr = f * (1 + 0.05 * Math.exp(-t * 20));
		x[n] = Math.sin(2 * Math.PI * fr * t) * Math.exp(-t * 3.2) + 0.4 * Math.sin(2 * Math.PI * fr * 1.5 * t) * Math.exp(-t * 5);
	}
	for (let n = 0; n < 500; n++) x[n] += nrand() * 0.5 * (1 - n / 500);
	return x;
}

// ------------------------------------------------------------------ foley
function noise(sec) {
	const x = buf(sec);
	for (let n = 0; n < x.length; n++) x[n] = nrand();
	return x;
}
function pencil(sec) {
	const x = noise(sec);
	filt(x, "bp", 3800, 0.9);
	let ph = 0;
	let rate = 11;
	for (let n = 0; n < x.length; n++) {
		const t = n / SR;
		if ((n & 2047) === 0) rate = 9 + 7 * Math.abs(nrand());
		ph += (2 * Math.PI * rate) / SR;
		const stroke = Math.pow(Math.abs(Math.sin(ph)), 0.6);
		const env = Math.min(1, t / 0.04) * Math.min(1, (sec - t) / 0.08);
		x[n] *= stroke * env * (0.6 + 0.4 * Math.abs(Math.sin(t * 3.1)));
	}
	return x;
}
function whoosh(sec = 0.6, f0 = 300, f1 = 2600) {
	const x = noise(sec);
	filt(x, "bp", (t) => {
		const u = t / sec;
		return u < 0.6 ? f0 + (f1 - f0) * (u / 0.6) : f1 - (f1 - f0) * 0.6 * ((u - 0.6) / 0.4);
	}, 1.4);
	for (let n = 0; n < x.length; n++) {
		const u = n / x.length;
		x[n] *= Math.pow(Math.sin(Math.PI * Math.min(1, u * 1.15)), 2);
	}
	return x;
}
function pop(f = 600, sec = 0.12) {
	const x = buf(sec);
	let ph = 0;
	for (let n = 0; n < x.length; n++) {
		const t = n / SR;
		const fr = f * (1 + 0.9 * Math.min(1, t / 0.03));
		ph += (2 * Math.PI * fr) / SR;
		x[n] = Math.sin(ph) * Math.exp(-t * 32) * Math.min(1, t / 0.002);
	}
	return x;
}
function boing(f = 160, sec = 0.6) {
	const x = buf(sec);
	let ph = 0;
	for (let n = 0; n < x.length; n++) {
		const t = n / SR;
		const fr = f * (1 + 0.5 * Math.exp(-t * 5) * Math.sin(2 * Math.PI * 14 * t)) * (1 + 0.6 * Math.exp(-t * 12));
		ph += (2 * Math.PI * fr) / SR;
		x[n] = (Math.sin(ph) + 0.3 * Math.sin(2 * ph)) * Math.exp(-t * 5);
	}
	return x;
}
function slideWhistle(sec = 1.0, f0 = 1900, f1 = 380) {
	const x = buf(sec);
	let ph = 0;
	for (let n = 0; n < x.length; n++) {
		const t = n / SR;
		const u = t / sec;
		const fr = f0 * Math.pow(f1 / f0, u) * (1 + 0.012 * Math.sin(2 * Math.PI * 6 * t));
		ph += (2 * Math.PI * fr) / SR;
		const env = Math.min(1, t / 0.05) * Math.min(1, (sec - t) / 0.08);
		x[n] = (Math.sin(ph) + 0.12 * Math.sin(2 * ph) + 0.03 * nrand()) * env;
	}
	return x;
}
function thud() {
	const k = kick({ f1: 90, f2: 32, decay: 3.2, len: 1.4 });
	const r = noise(1.4);
	filt(r, "lp", 180, 0.7);
	for (let n = 0; n < r.length; n++) k[n] += r[n] * 0.8 * Math.exp((-n / SR) * 3.5);
	// clatter of pieces settling
	for (let i = 0; i < 14; i++) {
		const s = Math.floor((0.05 + Math.pow(i / 14, 1.5) * 0.9) * SR);
		const c = woodblock(500 + Math.abs(nrand()) * 1400);
		const g = 0.25 * (1 - i / 16);
		for (let n = 0; n < c.length && s + n < k.length; n++) k[s + n] += c[n] * g;
	}
	return k;
}
function clink(f = 2600) {
	return mallet(f, 0.1, [
		[1, 1, 0.22],
		[2.4, 0.6, 0.12],
		[4.13, 0.35, 0.07],
		[5.9, 0.2, 0.04],
	], { click: 0.6 });
}
function stampSfx() {
	const x = kick({ f1: 120, f2: 60, decay: 14, len: 0.4 });
	const s = noise(0.08);
	filt(s, "bp", 1200, 0.8);
	for (let n = 0; n < s.length; n++) x[n] += s[n] * 0.9 * Math.exp((-n / SR) * 60);
	return x;
}
function clickSfx(f = 3000) {
	const x = buf(0.04);
	for (let n = 0; n < x.length; n++) x[n] = nrand() * Math.exp((-n / SR) * 400);
	filt(x, "bp", f, 1.5);
	return x;
}
function swish(sec = 0.45, f = 900) {
	const x = noise(sec);
	filt(x, "bp", (t) => f * (0.8 + 0.6 * (t / sec)), 0.8);
	for (let n = 0; n < x.length; n++) {
		const u = n / x.length;
		x[n] *= Math.sin(Math.PI * u) * (0.7 + 0.3 * Math.sin(n / 300));
	}
	return x;
}
function poof() {
	const x = noise(0.3);
	filt(x, "lp", (t) => 2500 * Math.exp(-t * 9) + 200, 0.8);
	for (let n = 0; n < x.length; n++) {
		const t = n / SR;
		x[n] *= Math.min(1, t / 0.01) * Math.exp(-t * 11);
	}
	return x;
}
function popper() {
	const x = noise(0.9);
	for (let n = 0; n < x.length; n++) {
		const t = n / SR;
		x[n] *= Math.exp(-t * 40) * 1.2;
	}
	filt(x, "bp", 1800, 0.6);
	// crackle
	for (let i = 0; i < 40; i++) {
		const s = Math.floor((0.05 + Math.abs(nrand()) * 0.75) * SR);
		const c = clickSfx(3000 + Math.abs(nrand()) * 4000);
		for (let n = 0; n < c.length && s + n < x.length; n++) x[s + n] += c[n] * 0.35;
	}
	const k = kick({ f1: 200, f2: 80, decay: 20, len: 0.2 });
	for (let n = 0; n < k.length; n++) x[n] += k[n] * 0.6;
	return x;
}
function flutter(sec = 0.7) {
	const x = noise(sec);
	filt(x, "lp", 1400, 0.7);
	for (let n = 0; n < x.length; n++) {
		const t = n / SR;
		x[n] *= (0.5 + 0.5 * Math.sin(2 * Math.PI * 13 * t)) * Math.exp(-t * 3) * Math.min(1, t / 0.05);
	}
	return x;
}
function sparkle(count = 8, base = 72, span = 1.0) {
	const x = buf(span + 1.2);
	const scale = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
	for (let i = 0; i < count; i++) {
		const s = Math.floor(((i / count) * span + Math.abs(nrand()) * 0.03) * SR);
		const m = mallet(mtof(base + scale[(i * 3 + 1) % scale.length]), 0.1, GLOCK, { click: 0.3 });
		const g = 0.35 * (1 - (i / count) * 0.5);
		for (let n = 0; n < m.length && s + n < x.length; n++) x[s + n] += m[n] * g;
	}
	return x;
}

// ------------------------------------------------------------------ score
// chords by bar start beat
const CHORDS = [
	[0, "F"], [4, "F"],
	[8, "Dm"], [12, "Gm"], [14, "A7"],
	[16, "F"], [20, "Am"], [24, "Bb"], [28, "C"],
	[32, "F"], [36, "Dm"], [40, "Bb"], [44, "C"],
	[49, "F"], [53, "Dm"], [57, "Bb"], [61, "C"],
	[65, "F"], [69, "Bb"], [71, "C7"], [73, "F"],
];
const CHORD_NOTES = {
	F: ["F", "A", "C"],
	Dm: ["D", "F", "A"],

async function buildSoundtrack(narrationArrayBuffer) {
	_seed = 12345;
	const len = Math.ceil(DURATION * SR);
	const ctx = new OfflineAudioContext(2, len, SR);

	// buses
	const master = ctx.createGain();
	const comp = ctx.createDynamicsCompressor();
	comp.threshold.value = -16;
	comp.knee.value = 8;
	comp.ratio.value = 3;
	comp.attack.value = 0.006;
	comp.release.value = 0.18;
	master.connect(comp);
	comp.connect(ctx.destination);

	const reverb = ctx.createConvolver();
	reverb.buffer = makeIR(ctx, 2.2);
	const revGain = ctx.createGain();
	revGain.gain.value = 0.32;
	reverb.connect(revGain);
	revGain.connect(master);

	// Events are mixed straight into stereo bus arrays in JS (thousands of
	// Web Audio nodes would make the offline render crawl); the audio graph
	// only handles narration, ducking, reverb and bus compression.
	const bus = {
		music: [new Float32Array(len), new Float32Array(len)],
		sfx: [new Float32Array(len), new Float32Array(len)],
		rev: [new Float32Array(len), new Float32Array(len)],
	};
	const dataCache = new Map();
	function play(data, when, which, gain = 1, pan = 0, rev = 0.2, key = null) {
		if (when < 0 || when > DURATION) return;
		let d;
		if (key && dataCache.has(key)) d = dataCache.get(key);
		else {
			d = data instanceof Function ? data() : data;
			if (key) dataCache.set(key, d);
		}
		const a = ((pan + 1) * Math.PI) / 4;
		const gl = Math.cos(a) * gain;
		const gr = Math.sin(a) * gain;
		const [L, R] = bus[which];
		const [RL, RR] = bus.rev;
		const s0 = Math.round(when * SR);
		const n = Math.min(d.length, len - s0);
		for (let k = 0; k < n; k++) {
			const v = d[k];
			L[s0 + k] += v * gl;
			R[s0 + k] += v * gr;
		}
		if (rev > 0) {
			const rl = gl * rev;
			const rr = gr * rev;
			for (let k = 0; k < n; k++) {
				const v = d[k];
				RL[s0 + k] += v * rl;
				RR[s0 + k] += v * rr;
			}
		}
	}
	const music = "music";
	const sfx = "sfx";
	const M = (b, fn, gain, pan, rev, key) => play(fn, bt(b), music, gain, pan, rev, key);

	// ---------------- music
	// celesta intro
	for (const [b, n, l] of MEL_CELESTA) M(b, () => mallet(hz(n), l * BEAT, CELESTA), 0.32, 0.2, 0.35, "cel" + n);
	// pizzicato bass + uke strums (intro, main sections)
	const pizzBass = (b, n, l = 0.45, g = 0.55) => M(b, () => pluck(hz(n), l * BEAT, { bright: 0.35, decay: 0.993, ring: 0.25 }), g, 0, 0.12, "pb" + n + l);
	const uke = (b, ch, g = 0.2, oct = 4) => {
		const notes = CHORD_NOTES[ch].slice(0, 3);
		notes.forEach((nm, i) => {
			const n = nm + (nm === "C" || nm === "D" || nm === "E" || nm === "C#" ? oct + 1 : oct);
			M(b + i * 0.018 / BEAT, () => pluck(hz(n), 0.25 * BEAT, { bright: 0.75, decay: 0.994, ring: 0.3, pos: 0.25 }), g, -0.35, 0.2, "uk" + n);
		});
	};
	const root = (ch, oct) => CHORD_NOTES[ch][0] + oct;
	const fifth = (ch, oct) => CHORD_NOTES[ch][2] + (["C", "D", "E", "C#"].includes(CHORD_NOTES[ch][2]) ? oct + 1 : oct);
	// intro bars 0-1 (beats 0..5)
	for (const b of [0, 1, 2, 3, 4, 5]) pizzBass(b, b % 2 ? "C3" : "F2", 0.4, 0.45);
	// grumble bars 2-3: tuba oom-pah + reed + woodblock
	const tubaLine = [[8, "D2"], [9, "A1"], [10, "D2"], [11, "A1"], [12, "G1"], [13, "D2"], [14, "A1"], [15, "E2"]];
	for (const [b, n] of tubaLine) M(b, () => tuba(hz(n), 0.42 * BEAT), 0.62, 0, 0.1, "tb" + n);
	for (let b = 8; b < 16; b++) {
		const ch = chordAt(b);
		M(b + 0.5, () => {
			const x = buf(0.3);
			for (const nm of CHORD_NOTES[ch].slice(0, 3)) {
				const p = pluck(hz(nm + "3"), 0.18, { bright: 0.4, decay: 0.99, ring: 0.1 });
				for (let n = 0; n < Math.min(x.length, p.length); n++) x[n] += p[n] * 0.5;

	S(CUE.finale - 0.9, () => revCymbal(0.9), 0.3, 0, 0.2);
	S(CUE.finale - 0.02, () => kick({ f1: 110, f2: 38, decay: 3, len: 1.2 }), 0.7, 0, 0.1);
	S(CUE.finale + 0.05, () => sparkle(12, 79, 1.2), 0.3, 0, 0.35);
	S(CUE.stop, () => pencil(1.35), 0.14, -0.1, 0.05);
	S(CUE.start, () => pencil(0.8), 0.14, 0.1, 0.05);
	S(CUE.start + 0.85, () => swish(0.4, 2000), 0.2, 0, 0.1);
	S(CUE.sting, () => sparkle(14, 84, 1.3), 0.4, 0, 0.4);
	S(CUE.iris, () => whoosh(1.2, 1800, 200), 0.12, 0, 0.2);

	// ---------------- graph: buses -> (duck) -> master, reverb, narration
	const busSource = (arrs, dest, gain = 1) => {
		const b = ctx.createBuffer(2, len, SR);
		b.copyToChannel(arrs[0], 0);
		b.copyToChannel(arrs[1], 1);
		const src = ctx.createBufferSource();
		src.buffer = b;
		const g = ctx.createGain();
		g.gain.value = gain;
		src.connect(g);
		g.connect(dest);
		src.start(0);
		return g;
	};
	const musicDuck = ctx.createGain();
	musicDuck.connect(master);
	busSource(bus.music, musicDuck, 0.62);
	busSource(bus.sfx, master, 0.55);
	busSource(bus.rev, reverb, 1);
	// duck music under narration
	const dg = musicDuck.gain;
	dg.setValueAtTime(1, 0);
	LINES.forEach((t0, i) => {
		const t1 = t0 + LINE_DURS[i];
		dg.setTargetAtTime(0.42, Math.max(0, t0 - 0.12), 0.05);
		dg.setTargetAtTime(1, t1 + 0.08, 0.18);
	});
	if (narrationArrayBuffer) {
		const nb = await ctx.decodeAudioData(narrationArrayBuffer.slice(0));
		const src = ctx.createBufferSource();
		src.buffer = nb;
		const voice = ctx.createGain();
		voice.gain.value = 1.0;
		src.connect(voice);
		voice.connect(master);
		const vs = ctx.createGain();
		vs.gain.value = 0.08;
		src.connect(vs);
		vs.connect(reverb);
		src.start(0);
	}

	const out = await ctx.startRendering();
	// master fade + peak normalise to -1 dBFS
	const L = out.getChannelData(0);
	const R = out.getChannelData(1);
	let pk = 0;
	for (let n = 0; n < L.length; n++) pk = Math.max(pk, Math.abs(L[n]), Math.abs(R[n]));
	const g = pk > 0 ? 0.89 / pk : 1;
	const fadeStart = Math.floor((DURATION - 0.35) * SR);
	for (let n = 0; n < L.length; n++) {
		const f = n > fadeStart ? Math.max(0, 1 - (n - fadeStart) / (L.length - fadeStart)) : 1;
		L[n] *= g * f;
		R[n] *= g * f;
	}
	return out;
}

function makeIR(ctx, sec) {
	const len = Math.floor(sec * SR);
	const ir = ctx.createBuffer(2, len, SR);
	for (let ch = 0; ch < 2; ch++) {
		const d = ir.getChannelData(ch);
		let lp = 0;
		for (let n = 0; n < len; n++) {
			const t = n / SR;
			lp += (nrand() - lp) * (0.55 - 0.4 * (t / sec));
			d[n] = lp * Math.pow(1 - t / sec, 2.2) * (t < 0.012 ? t / 0.012 : 1);
		}
	}
	return ir;
}

/** Encode an AudioBuffer as a 16-bit PCM WAV (ArrayBuffer). */
function encodeWav(ab) {
	const ch = ab.numberOfChannels;
	const n = ab.length;
	const out = new DataView(new ArrayBuffer(44 + n * ch * 2));
	const str = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
	str(0, "RIFF");
	out.setUint32(4, 36 + n * ch * 2, true);
	str(8, "WAVE");
	str(12, "fmt ");
	out.setUint32(16, 16, true);
	out.setUint16(20, 1, true);
	out.setUint16(22, ch, true);
	out.setUint32(24, ab.sampleRate, true);
	out.setUint32(28, ab.sampleRate * ch * 2, true);
	out.setUint16(32, ch * 2, true);
	out.setUint16(34, 16, true);
	str(36, "data");
	out.setUint32(40, n * ch * 2, true);
	const chans = [...Array(ch)].map((_, i) => ab.getChannelData(i));
	let o = 44;
	for (let i = 0; i < n; i++)
		for (let c = 0; c < ch; c++) {
			const v = Math.max(-1, Math.min(1, chans[c][i]));
			out.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7fff, true);
			o += 2;
		}
	return out.buffer;
}

/*
 * NextQuest — 15-second motion reel.
 *
 * Everything on screen is DOM + CSS 3D, positioned by render(t), a pure
 * function of time. No CSS transitions or animations, so realtime playback
 * and the frame-by-frame export are identical.
 *
 * Grid: 120 BPM (0.5 s per beat). Cuts and hits land on beats.
 */
"use strict";

const REEL_DUR = 15.0;
const RB = 0.5; // seconds per beat

// ------------------------------------------------------------------ math
const cl = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const mix = (a, b, t) => a + (b - a) * t;
const Ez = {
	lin: (t) => t,
	oc: (t) => 1 - Math.pow(1 - t, 3),
	ic: (t) => t * t * t,
	ioc: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
	oq: (t) => 1 - Math.pow(1 - t, 5),
	oe: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
	ie: (t) => (t === 0 ? 0 : Math.pow(2, 10 * t - 10)),
	ioe: (t) => (t === 0 ? 0 : t === 1 ? 1 : t < 0.5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2),
	ob: (t, s = 1.7) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2),
	ib: (t, s = 1.7) => (s + 1) * t * t * t - s * t * t,
};
const pr = (t, t0, d, e = Ez.ioc) => (d <= 0 ? (t >= t0 ? 1 : 0) : e(cl((t - t0) / d)));
const spr = (t, t0, f = 3, damp = 7) => (t < t0 ? 0 : Math.exp(-damp * (t - t0)) * Math.sin(2 * Math.PI * f * (t - t0)));
const decay = (t, t0, k = 8) => (t < t0 ? 0 : Math.exp(-k * (t - t0)));
const hsh = (n) => {
	const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
	return x - Math.floor(x);
};
const noise1 = (x) => {
	const i = Math.floor(x);
	const f = x - i;
	const u = f * f * (3 - 2 * f);
	return mix(hsh(i), hsh(i + 1), u) * 2 - 1;
};

// ------------------------------------------------------------------ style helpers
function T(el, o) {
	const s = el.style;
	const op = o.o ?? 1;
	if (op <= 0.001) {
		if (s.display !== "none") s.display = "none";
		return;
	}
	if (s.display === "none") s.display = "";
	s.opacity = op >= 0.999 ? "" : op.toFixed(3);
	s.transform = `translate3d(${(o.x ?? 0).toFixed(2)}px,${(o.y ?? 0).toFixed(2)}px,${(o.z ?? 0).toFixed(2)}px) rotateX(${(o.rx ?? 0).toFixed(3)}deg) rotateY(${(o.ry ?? 0).toFixed(3)}deg) rotateZ(${(o.rz ?? 0).toFixed(3)}deg) scale(${(o.sx ?? o.s ?? 1).toFixed(4)},${(o.sy ?? o.s ?? 1).toFixed(4)})`;
	const f = [];
	if (o.blur && o.blur > 0.05) f.push(`blur(${o.blur.toFixed(2)}px)`);
	if (o.bright !== undefined) f.push(`brightness(${o.bright.toFixed(3)})`);
	s.filter = f.join(" ");
}
const hide = (el) => {
	if (el.style.display !== "none") el.style.display = "none";
};
function rgbSplit(el, amt) {
	el.style.textShadow =
		amt > 0.2 ? `${amt.toFixed(1)}px 0 rgba(255,60,110,.85), ${(-amt).toFixed(1)}px 0 rgba(52,209,230,.85)` : "";
}
const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+/<>";
function decode(str, p, t, seed = 0) {
	const n = str.length;
	const shown = Math.floor(p * n);
	const tick = Math.floor(t * 30);
	let out = "";
	for (let i = 0; i < n; i++) {
		const c = str[i];
		if (i < shown || c === " " || c === "·") out += c;
		else if (i < shown + 6) out += GLYPHS[Math.floor(hsh(tick * 13.1 + i * 7.7 + seed) * GLYPHS.length)];
		else out += " ";
	}
	return out;
}
function setText(el, s) {
	if (el.textContent !== s) el.textContent = s;
}

// ------------------------------------------------------------------ render
function render(t) {
	renderBG(t);
	renderCamera(t);
	renderAct1(t);
	renderLogo(R.logo, t, TL.hit, true);
	renderAct3(t);
	renderAct4(t);
	renderFX(t);
}

function renderCamera(t) {
	let punch = 0;
	for (const w of TL.words) punch += spr(t, w, 2.2, 9) * 0.035;
	punch += spr(t, TL.hit, 2, 6) * 0.06 + spr(t, TL.final, 2, 6) * 0.06;
	for (const f of TL.feats.slice(1)) punch += spr(t, f, 2.4, 8) * 0.02;
	let sx = 0;
	let sy = 0;
	for (const [t0, a] of [
		[TL.hit, 22],
		[TL.final, 18],
	]) {
		const k = decay(t, t0, 7) * a;
		sx += k * noise1(t * 40 + t0);
		sy += k * noise1(t * 43 + t0 + 9);
	}
	const drift = noise1(t * 0.35) * 0.6;
	T(R.world, { x: sx, y: sy, s: 1 + punch, ry: drift, rx: noise1(t * 0.3 + 5) * 0.4 });
}

function renderAct1(t) {
	// laser
	if (t < 1.0) T(R.laser, { sx: pr(t, TL.laser, 0.45, Ez.oe), sy: 1 + 2 * decay(t, 0.1, 6), o: 1 - pr(t, 0.6, 0.35, Ez.ic) });
	else hide(R.laser);

	// wall of games
	if (t < TL.hit + 0.05) {
		const appear = pr(t, TL.wall, 0.9, Ez.oc);
		const scroll = 260 * t + 2200 * Math.pow(Math.max(0, t - 1.4), 2);
		const rowH = 118;
		const off = -(scroll % rowH);
		let snap = 0;
		TL.words.forEach((w, i) => {
			snap += (i % 2 ? -1 : 1) * 7 * pr(t, w, 0.25, Ez.oe);
		});
		const imp = pr(t, 3.12, 0.38, Ez.ie);
		T(R.wallWrap, {
			z: mix(-700, -150, appear) - imp * 1800,
			rx: mix(64, 52, appear),
			rz: -26 + snap + imp * 70,
			s: mix(1.1, 1, appear) * (1 - imp * 0.6),
			o: appear * 0.62 * (1 - imp),
		});
		T(R.wall, { y: off - 59, blur: Math.min(6, Math.max(0, t - 1.4) * 4) });
	} else hide(R.wallWrap);

	// counter
	if (t > TL.count - 0.05 && t < 1.55) {
		const p = pr(t, TL.count, 0.85, Ez.oq);
		const out = pr(t, 1.32, 0.18, Ez.ic);
		setText(R.countNum, p >= 0.999 ? "99+" : String(Math.round(99 * p)));
		setText(R.countLbl, decode("UNREAD IN THE GROUP CHAT", pr(t, 0.62, 0.55, Ez.lin), t, 3));
		T(R.count, { s: mix(1.25, 1, pr(t, TL.count, 0.5, Ez.oe)) * (1 + out * 0.15), blur: (1 - pr(t, TL.count, 0.35, Ez.oc)) * 14 + out * 14, o: pr(t, TL.count, 0.15, Ez.lin) * (1 - out), y: -out * 40 });
	} else hide(R.count);

	// kinetic words, hard cuts on the beat
	R.kw.forEach((el, i) => {
		const t0 = TL.words[i];
		const t1 = i < 3 ? TL.words[i + 1] : TL.hit;
		if (t < t0 || t >= t1) return hide(el);
		const u = pr(t, t0, 0.2, Ez.oe);
		const tilt = (i % 2 ? 1 : -1) * 2;
		let s = mix(1.55, 1, u);
		let o = 1;
		let blur = (1 - u) * 16;
		if (i === 3) {
			const fly = pr(t, 3.22, 0.28, Ez.ie);
			s *= 1 + fly * 4;
			o = 1 - fly;
			blur += fly * 20;
		}
		T(el, { s, rz: tilt * (1 - u * 0.6), o, blur });
		rgbSplit(el, 18 * decay(t, t0, 9));
	});
}

function renderLogo(L, t, t0, isIntro) {
	const end = isIntro ? 4.62 : 99;
	if (t < t0 - 0.02 || t > end) {
		hide(L.root);
		if (L === R.logo) hide(R.ring);
		return;
	}
	const zoom = isIntro ? pr(t, TL.zoom, 0.36, Ez.ie) : 0;
	T(L.root, { o: 1 - pr(t, end - 0.12, 0.12, Ez.lin) });
	// zoom-through: scale around the mark
	T(L.group, { x: -L.markX * zoom * 0, s: 1 + zoom * 14, o: 1 });
	L.group.style.transformOrigin = `${L.markX}px 0px`;
	const mp = pr(t, t0, 0.5, (x) => Ez.ob(x, 1.9));
	T(L.mark, { s: mix(0.15, 1, mp), rz: (1 - mp) * -120, o: pr(t, t0, 0.08, Ez.lin) });
	const c1 = L.mark.querySelector(".c1");
	const c2 = L.mark.querySelector(".c2");
	c1.setAttribute("stroke-dashoffset", (36 * (1 - pr(t, t0 + 0.08, 0.28, Ez.oc))).toFixed(2));
	c2.setAttribute("stroke-dashoffset", (36 * (1 - pr(t, t0 + 0.16, 0.28, Ez.oc))).toFixed(2));
	L.chars.forEach((c, i) => {
		const u = pr(t, t0 + 0.1 + i * 0.028, 0.45, Ez.oe);
		c.style.transform = `translate3d(0,${((1 - u) * 110).toFixed(1)}%,0)`;
	});
	// light sweep
	const sw = pr(t, t0 + 0.45, 0.8, Ez.ioc);
	const pos = `${mix(100, 0, sw).toFixed(1)}% 0`;
	L.chars.forEach((c) => (c.style.backgroundPosition = pos));
	if (L.sub) {
		setText(L.sub, decode(L.subText, pr(t, t0 + 0.32, 0.42, Ez.lin), t, 11));
		T(L.sub, { o: pr(t, t0 + 0.3, 0.1, Ez.lin) * (1 - zoom) });
	}
	// ring shockwave
	if (L === R.logo || L === R.lock) {
		const ring = R.ring;
		const rp = cl((t - t0) / 0.7);
		if (rp > 0 && rp < 1) {
			ring.style.top = `${L === R.lock ? 430 : 540}px`;
			T(ring, { o: 1 });
			[...ring.children].forEach((r, k) => {
				const u = Ez.oc(cl(rp * (1 + k * 0.3) - k * 0.15));
				const rad = 60 + u * (700 + k * 300);
				Object.assign(r.style, {
					left: `${-rad + L.markX}px`,
					top: `${-rad}px`,
					width: `${rad * 2}px`,
					height: `${rad * 2}px`,
					opacity: ((1 - u) * 0.9).toFixed(3),
					borderWidth: `${(1 - u) * 6 + 1}px`,
					borderColor: k ? "#8b7cff" : "#34d1e6",
				});
			});
		} else if (t > t0 + 0.7) hide(ring);
	}
}

function renderAct3(t) {
	const f = TL.feats;
	const vis = t > f[0] - 0.1 && t < 13.6;
	if (!vis) {
		hide(R.heads);
		hide(R.panels);
		hide(R.rail);
		return;
	}
	const fadeAll = pr(t, 12.3, 0.25, Ez.ic);
	T(R.heads, { o: 1 - fadeAll, x: -fadeAll * 80 });
	T(R.rail, { o: pr(t, f[0] + 0.2, 0.3, Ez.lin) * (1 - fadeAll) });
	T(R.panels, {});
	// rail fill
	R.seg.forEach((s, i) => {
		const fill = cl((t - f[i]) / 2);
		s.querySelector("i").style.width = `${(fill * 100).toFixed(2)}%`;
		s.querySelector(".lb").style.color = t >= f[i] && t < f[i] + 2 ? "#e7ebf1" : "#5d6676";
	});
	// headlines
	R.hl.forEach((hl, i) => {
		const t0 = i === 0 ? f[0] + 0.05 : f[i];
		const tOut = i < 3 ? f[i] + 1.74 : 99;
		if (t < t0 - 0.01 || t > tOut + 0.36) return hide(hl);
		T(hl, {});
		const lines = hl.querySelectorAll(".ln > span");
		lines.forEach((ln, k) => {
			const uin = pr(t, t0 + 0.1 + k * 0.07, 0.5, Ez.oe);
			const uout = pr(t, tOut + k * 0.04, 0.22, Ez.ic);
			ln.style.transform = `translate3d(0,${((1 - uin) * 112 - uout * 112).toFixed(1)}%,0)`;
		});
		const idx = hl.querySelector(".idxt");
		setText(idx, decode(["POST", "DISCORD", "JOIN", "WRAP UP"][i], pr(t, t0, 0.3, Ez.lin), t, i));
		const sub = hl.querySelector(".sub");
		T(sub, { o: pr(t, t0 + 0.3, 0.35, Ez.oc) * (1 - pr(t, tOut - 0.05, 0.15, Ez.lin)), y: (1 - pr(t, t0 + 0.3, 0.5, Ez.oe)) * 24 });
		T(hl.querySelector(".idx"), { o: 1 - pr(t, tOut, 0.25, Ez.lin) });
	});
	// panels
	R.p.forEach((P, i) => {
		const t0 = f[i] - 0.05;
		const tOut = i < 3 ? f[i] + 1.84 : 99;
		const inU = pr(t, t0, 0.62, Ez.oe);
		const outU = pr(t, tOut, 0.42, Ez.ie);
		const local = t - f[i];
		// fan arrangement in act 4
		const fanIn = pr(t, TL.fanIn + i * 0.035, 0.5, Ez.oe);
		const coll = pr(t, TL.collapse, 0.2, Ez.ie);
		if (fanIn > 0) {
			const k = i - 1.5;
			const base = { x: 0, y: 0, z: 0, ry: -16, rx: 6, s: 1 };
			const fan = { x: -410 + k * 420, y: 60, z: -260 - Math.abs(k) * 150, ry: k * -22, rx: 4, s: 0.6 };
			const from = i === 3 ? base : { ...fan, x: fan.x + 600, z: fan.z - 900, ry: fan.ry - 40 };
			const u = fanIn;
			const spin = (t - TL.fanIn) * 6;
			renderPanel(i, P, 3);
			return T(P.el, {
				x: mix(from.x, fan.x, u) * (1 - coll),
				y: mix(from.y, fan.y, u) * (1 - coll),
				z: mix(from.z, fan.z, u) - coll * 1200,
				ry: mix(from.ry, fan.ry, u) + spin,
				rx: mix(from.rx, fan.rx, u),
				s: mix(from.s, fan.s, u) * (1 - coll * 0.7),
				o: (i === 3 ? 1 : cl(u * 2)) * (1 - coll),
				blur: coll * 10,
			});
		}
		if (t < t0 || outU >= 1) return hide(P.el);
		const float = Math.sin((t + i) * 1.3) * 8;
		T(P.el, {
			x: mix(560, 0, inU) - outU * 160,
			y: float - outU * 140,
			z: mix(-420, 0, inU) - outU * 1100,
			ry: mix(-58, -16, inU) - outU * 24 + noise1(t * 0.5 + i) * 2,
			rx: 6 + outU * 22 + noise1(t * 0.4 + 3 + i) * 1.5,
			o: cl(inU * 1.6) * (1 - outU),
			blur: (1 - inU) * 10 + outU * 8,
		});
		renderPanel(i, P, local);
	});
}

function renderPanel(i, P, u) {
	[renderP1, renderP2, renderP3, renderP4][i](P, u);
}

function typed(str, u, at) {
	let n = 0;
	for (let i = 0; i < str.length; i++) if (u >= at(i)) n = i + 1;
	return str.slice(0, n);
}

function renderP1(P, u) {
	const q = typed(P1_QUERY, u, P1_TYPE);
	setText(P.q, q);
	P.ph.style.display = q ? "none" : "";
	const done = u >= P1_TYPE(P1_QUERY.length - 1) + 0.06;
	P.search.classList.toggle("focus", u > 0.06 && !done);
	P.caret.style.opacity = u > 0.06 && !done && Math.floor(u * 5) % 2 === 0 ? "1" : "0";
	const gp = pr(u, P1_TYPE(P1_QUERY.length - 1) + 0.04, 0.25, Ez.oe);
	T(P.gpick, { o: gp, x: (1 - gp) * 30 });
	// when-chips: a quick hover across, landing on "Tonight 8pm"
	const hov = Math.floor(cl((u - (P1_WHEN_T - 0.16)) / 0.08));
	P.whenEls.forEach((c, k) => {
		const sel = k === 1 && u >= P1_WHEN_T;
		c.className = "chip wc" + (sel ? " on-v" : !sel && u >= P1_WHEN_T - 0.16 && u < P1_WHEN_T && k === hov ? " hov" : "");
		T(c, { s: sel ? 1 + 0.12 * spr(u, P1_WHEN_T, 3, 9) : 1 });
	});
	P.opts.forEach((op, k) => {
		const on = k === 0 && u >= P1_VIS_T;
		op.className = "opt" + (on ? " on" : "");
		T(op, { s: on ? 1 + 0.05 * spr(u, P1_VIS_T, 3, 9) : 1 });
	});
	const press = u >= P1_POST_T ? 1 - 0.07 * Math.max(0, spr(u, P1_POST_T, 2.5, 10)) - 0.06 * decay(u, P1_POST_T, 18) : 1;
	T(P.btn, { s: press });
	P.btn.classList.toggle("done", u >= P1_POST_T + 0.06);
	setText(P.btn, u >= P1_POST_T + 0.06 ? "Posted" : "+ Post session");
	const nu = pr(u, P1_POST_T + 0.1, 0.35, Ez.oe);
	T(P.note, { o: nu, x: (1 - nu) * -20 });
	P.more.classList.toggle("on", u >= 1.0);
}

function renderP2(P, u) {
	T(P.old, { o: pr(u, 0.0, 0.25, Ez.oc) * 0.55 });
	const mu = pr(u, 0.14, 0.42, Ez.oe);
	T(P.msg, { o: mu, y: (1 - mu) * 50 });
	const joined = P2_JOIN.filter((j) => u >= j.u);
	const names = ["Casey", ...joined.map((j) => j.name)];
	setText(P.incount, `In (${names.length}/6)`);
	setText(P.innames, names.join(", "));
	const last = joined.length ? joined[joined.length - 1].u : -9;
	const fl = decay(u, last, 5);
	P.inField.style.background = `rgba(46,204,113,${(0.22 * fl).toFixed(3)})`;
	P.inField.style.boxShadow = fl > 0.02 ? `0 0 0 2px rgba(46,204,113,${(0.7 * fl).toFixed(3)})` : "";
	T(P.edited, { o: joined.length ? pr(u, P2_JOIN[0].u, 0.2, Ez.lin) : 0 });
	T(P.embed, { s: 1 + 0.012 * fl });
	const ru = pr(u, P2_REMIND_T, 0.35, Ez.oe);
	T(P.remind, { o: ru, y: (1 - ru) * 30 });
}

function renderP3(P, u) {
	const cu = pr(u, 0.08, 0.4, Ez.oe);
	T(P.card, { o: cu, y: (1 - cu) * 30 });
	const c2 = pr(u, 0.22, 0.4, Ez.oe);
	T(P.card2, { o: c2 * 0.85, y: (1 - c2) * 30 });
	const tu = pr(u, P3_GUEST_T, 0.4, Ez.oe) * (1 - pr(u, P3_GUEST_T + 1.1, 0.3, Ez.ic));
	T(P.toast, { o: tu, y: (1 - pr(u, P3_GUEST_T, 0.4, Ez.oe)) * -40, x: 0 });
	const show = [true, true, true, u >= P3_GUEST_T + 0.15, u >= P3_IN_T + 0.05];
	P.faceEls.forEach((f, k) => {
		const t0 = k === 3 ? P3_GUEST_T + 0.15 : k === 4 ? P3_IN_T + 0.05 : 0;
		const s = k < 3 ? 1 : pr(u, t0, 0.3, (x) => Ez.ob(x, 2.6));
		T(f, { s, o: show[k] ? 1 : 0 });
	});
	const n = show.filter(Boolean).length;
	setText(P.rcount, `${n} in · ${6 - n} seat${6 - n === 1 ? "" : "s"} left`);
	const pressed = u >= P3_IN_T;
	P.yes.classList.toggle("on", pressed);
	T(P.yes, { s: pressed ? 1 - 0.08 * decay(u, P3_IN_T, 14) + 0.05 * spr(u, P3_IN_T + 0.05, 3, 9) : 1 });
}

function renderP4(P, u) {
	P.cw.forEach((c, k) => {

function renderAct4(t) {
	// kinds, hard cuts on 8th notes
	R.kd.forEach((el, i) => {

// ------------------------------------------------------------------ background + fx canvases
let BGX = null;
let FXX = null;
let GRAIN = [];
const PARTS = Array.from({ length: 140 }, (_, i) => ({
	x: hsh(i * 1.3) * 1920,
	y: hsh(i * 2.7) * 1080,
	z: 0.3 + hsh(i * 4.1) * 1.4,
	r: 0.6 + hsh(i * 5.9) * 1.8,
	c: hsh(i * 7.3) < 0.7 ? "52,209,230" : "139,124,255",
}));

function initCanvases() {
	BGX = document.getElementById("bg").getContext("2d");
	FXX = document.getElementById("fx").getContext("2d");
	for (let k = 0; k < 4; k++) {
		const c = document.createElement("canvas");
		c.width = c.height = 256;
		const x = c.getContext("2d");
		const img = x.createImageData(256, 256);
		let s = 1234 + k * 999;
		for (let i = 0; i < img.data.length; i += 4) {
			s = (s * 1664525 + 1013904223) >>> 0;
			const v = s >>> 24;
			img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
			img.data[i + 3] = 255;
		}
		x.putImageData(img, 0, 0);
		GRAIN.push(x.createPattern(c, "repeat"));
	}
}

function beatPulse(t) {
	if (t < TL.feats[0] || t > 12.5) return 0;
	const b = Math.floor((t - TL.feats[0]) / RB);
	return decay(t, TL.feats[0] + b * RB, 7);
}

function renderBG(t) {
	const x = BGX;
	x.globalCompositeOperation = "source-over";
	x.fillStyle = "#05070a";
	x.fillRect(0, 0, 1920, 1080);
	const pulse = beatPulse(t);
	const act3 = pr(t, 4.4, 0.6, Ez.oc);
	const glow = (cx, cy, r, rgb, a) => {
		const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
		g.addColorStop(0, `rgba(${rgb},${a})`);
		g.addColorStop(1, `rgba(${rgb},0)`);
		x.fillStyle = g;
		x.fillRect(0, 0, 1920, 1080);
	};
	x.globalCompositeOperation = "lighter";
	glow(mix(960, 1380, act3) + Math.sin(t * 0.7) * 60, mix(520, 480, act3), 900, "52,209,230", 0.13 + 0.06 * pulse + 0.25 * decay(t, TL.hit, 3) + 0.25 * decay(t, TL.final, 3));
	glow(mix(300, 260, act3) + Math.cos(t * 0.5) * 80, 960, 1000, "139,124,255", 0.12 + 0.04 * pulse);
	glow(1700, 120, 700, "255,107,107", 0.03 * act3);
	// perspective floor grid
	const ga = 0.12 * act3 * (1 - pr(t, 13.3, 0.3, Ez.lin)) + 0.08 * pr(t, 13.6, 0.6, Ez.lin);
	if (ga > 0.005) {
		const hy = 640;
		x.strokeStyle = `rgba(52,209,230,${ga})`;
		x.lineWidth = 1;
		for (let k = -16; k <= 16; k++) {
			x.beginPath();
			x.moveTo(960 + k * 40, hy);
			x.lineTo(960 + k * 400, 1080);
			x.stroke();
		}
		const scroll = (t * 0.9) % 1;
		for (let k = 0; k < 14; k++) {
			const z = (k + 1 - scroll) / 14;
			const y = hy + Math.pow(z, 2.2) * (1080 - hy);
			x.globalAlpha = Math.pow(z, 0.8);
			x.beginPath();
			x.moveTo(0, y);
			x.lineTo(1920, y);
			x.stroke();
		}
		x.globalAlpha = 1;
	}
	// particles
	for (const p of PARTS) {
		const y = (((p.y - t * 40 * p.z) % 1080) + 1080) % 1080;
		const xx = p.x + Math.sin(t * 0.6 + p.y) * 20 * p.z;
		x.fillStyle = `rgba(${p.c},${(0.18 + 0.25 * pulse) * p.z * 0.6})`;
		x.beginPath();
		x.arc(xx, y, p.r * p.z, 0, Math.PI * 2);
		x.fill();
	}
	x.globalCompositeOperation = "source-over";
}

function renderFX(t) {
	const x = FXX;
	x.clearRect(0, 0, 1920, 1080);
	// vignette
	const v = x.createRadialGradient(960, 540, 420, 960, 540, 1150);
	v.addColorStop(0, "rgba(0,0,0,0)");
	v.addColorStop(1, "rgba(0,0,0,0.5)");
	x.fillStyle = v;
	x.fillRect(0, 0, 1920, 1080);
	// flashes on the two big hits
	const fl = Math.max(decay(t, TL.hit, 14) * 0.9, decay(t, TL.final, 14) * 0.75, decay(t, 0.02, 20) * 0.25);
	if (fl > 0.01) {
		x.fillStyle = `rgba(220,250,255,${fl})`;
		x.fillRect(0, 0, 1920, 1080);
	}
	// zoom-through dip to black between logo and features
	const dip = Math.min(pr(t, 4.4, 0.12, Ez.lin), 1 - pr(t, 4.52, 0.2, Ez.lin));
	if (dip > 0.01) {
		x.fillStyle = `rgba(5,7,10,${dip})`;
		x.fillRect(0, 0, 1920, 1080);
	}
	// film grain
	x.globalAlpha = 0.04;
	x.globalCompositeOperation = "overlay";
	x.fillStyle = GRAIN[Math.floor(t * 30) % 4];
	x.save();
	x.translate(Math.floor(hsh(Math.floor(t * 30)) * 256), Math.floor(hsh(Math.floor(t * 30) + 7) * 256));
	x.fillRect(-256, -256, 1920 + 512, 1080 + 512);
	x.restore();
	x.globalAlpha = 1;
	x.globalCompositeOperation = "source-over";
}

/*
 * Soundtrack for the NextQuest reel: a 120 BPM electronic cue plus UI sound
 * design, synthesized in JS (DSP helpers come from ../animation/src/audio.js)
 * and finished with reverb + bus compression in an OfflineAudioContext.
 */
"use strict";

const RA = {
	// chord per bar (bars are 4 beats = 2 s, starting on the feature cuts)
	act1: ["A3", "C4", "E4"],
	hitChord: ["C3", "G3", "C4", "E4", "G4", "D5"],
	bars: [
		[4.5, ["F2", "A3", "C4", "E4"]],
		[6.5, ["G2", "B3", "D4", "G4"]],
		[8.5, ["A2", "C4", "E4", "G4"]],
		[10.5, ["F2", "A3", "C4", "F4"]],
	],
	build: ["G2", "B3", "D4", "F4"],
	final: ["C2", "G3", "C4", "E4", "G4", "D5"],
};

// ------------------------------------------------------------------ synths
function supersaw(freq, dur, o = {}) {
	const x = buf(dur + (o.rel ?? 0.3));
	const det = [-0.14, -0.07, 0, 0.07, 0.14];
	det.forEach((d, i) => osc(x, "saw", freq * Math.pow(2, d / 12), 0.22, i * 731));
	filt(x, "lp", (t) => (o.cut ?? 3200) * (o.sweep ? 0.35 + 0.65 * Math.min(1, t / o.sweep) : 1), 0.9);
	filt(x, "hp", 120, 0.7);
	adsr(x, o.att ?? 0.01, o.dec ?? 0.25, o.sus ?? 0.6, o.rel ?? 0.3, dur);
	return x;
}
function subBass(freq, dur) {
	const x = buf(dur + 0.06);
	osc(x, "saw", freq, 0.25);
	for (let n = 0; n < x.length; n++) x[n] += Math.sin((2 * Math.PI * freq * n) / SR) * 0.9;
	filt(x, "lp", 420, 0.8);
	adsr(x, 0.006, 0.08, 0.85, 0.05, dur);
	return x;
}
function pluckSynth(freq, dur = 0.18) {
	const x = buf(dur + 0.2);
	osc(x, "saw", freq, 0.5);
	osc(x, "square", freq * 2.003, 0.18, 500);
	filt(x, "lp", (t) => 600 + 5200 * Math.exp(-t * 22), 1.4);
	adsr(x, 0.002, 0.12, 0.15, 0.12, dur);
	return x;
}
function blip(freq, dur = 0.05, gain = 1) {
	const x = buf(dur + 0.03);
	for (let n = 0; n < x.length; n++) {
		const t = n / SR;
		x[n] = Math.sin(2 * Math.PI * freq * t) * Math.exp(-t * 60) * gain;
	}
	return x;
}
function riser(sec, f0 = 300, f1 = 6000) {
	const x = noise(sec);
	filt(x, "bp", (t) => f0 * Math.pow(f1 / f0, t / sec), 1.2);
	let ph = 0;
	for (let n = 0; n < x.length; n++) {
		const t = n / SR;
		const u = t / sec;
		ph += (2 * Math.PI * (180 * Math.pow(7, u))) / SR;
		x[n] = (x[n] * 0.9 + Math.sin(ph) * 0.25) * Math.pow(u, 1.6);
	}
	return x;
}
function impact() {
	const x = kick({ f1: 140, f2: 34, decay: 2.4, len: 1.8 });
	const n = noise(1.2);
	filt(n, "lp", (t) => 6000 * Math.exp(-t * 6) + 150, 0.7);
	for (let k = 0; k < n.length; k++) x[k] += n[k] * 0.7 * Math.exp((-k / SR) * 5);
	return x;
}
function clap() {
	const x = snap();
	const s = snare({ decay: 22 });
	for (let n = 0; n < Math.min(x.length, s.length); n++) x[n] = x[n] * 0.8 + s[n] * 0.5;
	return x;
}

// ------------------------------------------------------------------ score + sfx
async function buildReelSoundtrack() {
	_seed = 777;
	const len = Math.ceil(REEL_DUR * SR);
	const bus = {
		pump: [new Float32Array(len), new Float32Array(len)],
		drums: [new Float32Array(len), new Float32Array(len)],
		sfx: [new Float32Array(len), new Float32Array(len)],
		rev: [new Float32Array(len), new Float32Array(len)],
	};
	const cache = new Map();
	function play(fn, when, which, gain = 1, pan = 0, rev = 0.15, key = null) {
		if (when < 0 || when >= REEL_DUR) return;
		let d;
		if (key && cache.has(key)) d = cache.get(key);
		else {
			d = fn();
			if (key) cache.set(key, d);
		}
		const a = ((pan + 1) * Math.PI) / 4;
		const gl = Math.cos(a) * gain;
		const gr = Math.sin(a) * gain;
		const [L, R2] = bus[which];
		const [RL, RR] = bus.rev;
		const s0 = Math.round(when * SR);
		const n = Math.min(d.length, len - s0);
		for (let k = 0; k < n; k++) {
			const v = d[k];
			L[s0 + k] += v * gl;
			R2[s0 + k] += v * gr;
			if (rev) {
				RL[s0 + k] += v * gl * rev;
				RR[s0 + k] += v * gr * rev;
			}
		}
	}
	const kicks = [];
	const K = (t, g = 0.9) => {
		kicks.push(t);
		play(() => kick({ f1: 160, f2: 48, decay: 8, len: 0.45 }), t, "drums", g, 0, 0.02, "k");
	};

	// ---------- act 1: tension
	play(() => kick({ f1: 120, f2: 40, decay: 5, len: 0.9 }), 0.0, "sfx", 0.5, 0, 0.2);
	play(() => whoosh(0.5, 3000, 300), 0.0, "sfx", 0.25, 0, 0.2);
	RA.act1.forEach((n, i) => play(() => supersaw(hz(n), 3.3, { att: 0.6, cut: 1400, sus: 0.8, rel: 0.2, sweep: 3 }), 0.05, "pump", 0.16, i - 1, 0.35, "pad1" + n));
	for (let b = 0; b < 12; b++) play(() => hat(55, 9000), 0.25 + b * 0.25, "drums", 0.08 + b * 0.008, 0.4, 0.05, "hat");
	// notification pings from the group chat
	[0.22, 0.48, 0.71, 0.9, 1.08, 1.21, 1.33].forEach((t, k) => {
		const fr = [988, 1175, 880, 1319, 1047, 1175, 1397][k];
		play(() => {
			const x = blip(fr, 0.07, 1);
			const y = blip(fr * 1.5, 0.09, 0.8);
			const out = buf(0.2);
			for (let n = 0; n < x.length; n++) out[n] += x[n];
			for (let n = 0; n < y.length; n++) out[Math.floor(0.06 * SR) + n] += y[n];
			return out;
		}, t, "sfx", 0.13 + k * 0.012, k % 2 ? 0.55 : -0.55, 0.15);
	});
	// counter blips (one per value change bucket)
	for (let k = 0; k < 26; k++) {
		const u = k / 26;
		// invert the counter's ease-out so blips follow the digits
		const t = TL.count + 0.85 * (1 - Math.pow(1 - u, 1 / 5)) * 0.999;
		play(() => blip(1800 + k * 40, 0.04), t, "sfx", 0.18, 0.2, 0.05);
	}
	// word hits
	const stabs = [
		["A3", "C4", "E4"],
		["A3", "C4", "E4"],
		["F3", "A3", "C4"],
		["G3", "B3", "D4"],
	];
	TL.words.forEach((t, i) => {
		K(t, 1);
		play(() => clap(), t, "drums", 0.5, 0, 0.25, "clap");
		stabs[i].forEach((n, j) => play(() => supersaw(hz(n), 0.18, { cut: 5000, dec: 0.1, sus: 0.3, rel: 0.15 }), t, "pump", 0.2, j - 1, 0.3, "stab" + n));
		play(() => subBass(hz(stabs[i][0].replace("3", "1")), 0.4), t, "pump", 0.6, 0, 0, "sb" + i);
		play(() => whoosh(0.25, 2500, 400), t - 0.06, "sfx", 0.18, i % 2 ? 0.5 : -0.5, 0.1);
	});
	play(() => riser(0.5, 400, 9000), 3.0, "sfx", 0.5, 0, 0.2);
	play(() => revCymbal(0.6), 2.9, "sfx", 0.35, 0, 0.2);

	// ---------- act 2: logo hit
	play(() => impact(), TL.hit, "sfx", 1.25, 0, 0.25);
	play(() => crash(2.6), TL.hit, "drums", 0.35, 0.1, 0.3, "crash");
	RA.hitChord.forEach((n, i) => play(() => supersaw(hz(n), 0.8, { cut: 6000, dec: 0.5, sus: 0.4, rel: 0.6 }), TL.hit, "pump", 0.13, (i / 5) * 2 - 1, 0.45));
	play(() => sparkle(10, 84, 0.7), TL.hit + 0.08, "sfx", 0.4, 0, 0.45);
	for (let i = 0; i < 9; i++) play(() => blip(3200 + i * 220, 0.03), TL.hit + 0.32 + i * 0.045, "sfx", 0.06, 0.3, 0.05);
	// arpeggio pickup
	const arp = ["C4", "E4", "G4", "C5", "E5", "G5", "C6", "E6"];
	arp.forEach((n, i) => play(() => pluckSynth(hz(n)), 3.75 + i * 0.0625, "pump", 0.16, (i % 2 ? 0.4 : -0.4), 0.3, "pl" + n));
	play(() => whoosh(0.4, 400, 5000), TL.zoom - 0.05, "sfx", 0.45, 0, 0.2);
	play(() => revCymbal(0.45), TL.zoom - 0.05, "sfx", 0.25, 0, 0.2);

	// ---------- act 3: groove (bars on the feature cuts)
	for (const [t0, ch] of RA.bars) {
		for (let b = 0; b < 4; b++) {
			const t = t0 + b * RB;
			K(t);
			if (b % 2 === 1) play(() => clap(), t, "drums", 0.42, 0, 0.2, "clap");
			play(() => hat(18, 7000), t + RB / 2, "drums", 0.16, 0.35, 0.05, "ohat");
			for (let s = 0; s < 4; s++) if (s !== 2) play(() => hat(80, 9000), t + s * (RB / 4), "drums", 0.06 + (s % 2) * 0.03, -0.3, 0.02, "chat");
			// offbeat bass
			play(() => subBass(hz(ch[0]), 0.2), t + RB / 2, "pump", 0.42, 0, 0, "ob" + ch[0]);
			// 16th pluck arp over chord tones
			const tones = ch.slice(1).concat([ch[1].replace(/\d/, (d) => String(Number(d) + 1))]);
			for (let s = 0; s < 4; s++) {
				const n = tones[(b * 4 + s) % tones.length];
				play(() => pluckSynth(hz(n)), t + s * (RB / 4), "pump", 0.11, s % 2 ? 0.35 : -0.35, 0.25, "pl" + n);
			}
		}
		ch.slice(1).forEach((n, i) => play(() => supersaw(hz(n), 1.9, { att: 0.05, cut: 2600, sus: 0.7, rel: 0.2 }), t0, "pump", 0.11, i - 1, 0.35, "pad" + n));
		play(() => subBass(hz(ch[0].replace("2", "1")), 1.9), t0, "pump", 0.16, 0, 0, "sub" + ch[0]);
		if (t0 > TL.feats[0]) {
			play(() => whoosh(0.45, 300, 4000), t0 - 0.28, "sfx", 0.4, 0.3, 0.15);
			play(() => crash(1.2), t0, "drums", 0.12, -0.2, 0.3, "crash12");
		}
	}
	// UI sound design (times mirror reel.js)
	const f = TL.feats;
	const ping = (fr) => {
		// two-tone chat notification
		const x = blip(fr, 0.07, 1);
		const y = blip(fr * 1.5, 0.09, 0.8);
		const s0 = Math.floor(0.06 * SR);
		const out = buf(0.2);
		for (let n = 0; n < x.length; n++) out[n] += x[n];
		for (let n = 0; n < y.length && s0 + n < out.length; n++) out[s0 + n] += y[n];
		return out;
	};
	// 01 post: type the game, tap a time, choose open, post
	for (let i = 0; i < P1_QUERY.length; i++) play(() => clickSfx(2200 + ((i * 397) % 1200)), f[0] + P1_TYPE(i), "sfx", 0.2, 0.3, 0.02);
	play(() => pop(560, 0.12), f[0] + P1_TYPE(P1_QUERY.length - 1) + 0.05, "sfx", 0.22, 0.3, 0.1);
	[0, 1, 2].forEach((k) => play(() => clickSfx(3000), f[0] + P1_WHEN_T - 0.16 + k * 0.08, "sfx", 0.1, 0.35, 0.02));
	play(() => blip(1320, 0.07), f[0] + P1_WHEN_T, "sfx", 0.3, 0.35, 0.12);
	play(() => blip(1760, 0.07), f[0] + P1_VIS_T, "sfx", 0.3, 0.35, 0.12);
	play(() => {
		const x = clickSfx(1500);
		const y = kick({ f1: 300, f2: 120, decay: 30, len: 0.15 });
		for (let n = 0; n < x.length; n++) y[n] += x[n];
		return y;
	}, f[0] + P1_POST_T, "sfx", 0.5, 0.35, 0.1);
	["C6", "E6", "G6"].forEach((n, k) => play(() => mallet(hz(n), 0.2, GLOCK), f[0] + P1_POST_T + 0.08 + k * 0.05, "sfx", 0.18, 0.35, 0.35));
	// 02 discord: the card lands, then gets edited as people join, then the reminder
	play(() => ping(988), f[1] + 0.16, "sfx", 0.3, 0.3, 0.15);
	P2_JOIN.forEach((j, k) => {
		play(() => blip(1046 + k * 196, 0.06), f[1] + j.u, "sfx", 0.28, 0.3, 0.12);
		play(() => swish(0.18, 2600), f[1] + j.u - 0.04, "sfx", 0.1, 0.3, 0.05);
	});
	play(() => ping(880), f[1] + P2_REMIND_T, "sfx", 0.25, 0.3, 0.15);
	// 03 join: a guest arrives from an invite link, then you tap I'm in
	play(() => pop(700, 0.12), f[2] + P3_GUEST_T, "sfx", 0.26, 0.4, 0.1);
	play(() => blip(1568, 0.06), f[2] + P3_GUEST_T + 0.15, "sfx", 0.2, 0.4, 0.12);
	play(() => clickSfx(1800), f[2] + P3_IN_T, "sfx", 0.45, 0.35, 0.05);
	["E6", "A6"].forEach((n, k) => play(() => mallet(hz(n), 0.2, GLOCK), f[2] + P3_IN_T + 0.05 + k * 0.06, "sfx", 0.2, 0.35, 0.35));
	// 04 wrap up: ticks, stars, a line of text, same time next week
	for (let k = 0; k < 5; k++) play(() => clickSfx(2600 + k * 150), f[3] + 0.2 + k * 0.06, "sfx", 0.14, -0.2 + k * 0.1, 0.03);
	P4_STARS.forEach((u, k) => play(() => blip(mtof(76 + [0, 4, 7, 12][k]), 0.06), f[3] + u, "sfx", 0.26, 0.35, 0.15));
	for (let i = 0; i < P4_RECAP.length; i += 2) play(() => clickSfx(2000 + ((i * 263) % 1500)), f[3] + P4_RECAP_T(i), "sfx", 0.12, 0.3, 0.02);
	play(() => clickSfx(1400), f[3] + P4_REPEAT_T, "sfx", 0.35, 0.35, 0.05);
	play(() => pop(820, 0.12), f[3] + P4_STATS_T, "sfx", 0.24, 0.35, 0.1);
	for (let k = 0; k < 10; k++) play(() => blip(2400 + k * 60, 0.025), f[3] + P4_STATS_T + 0.4 * (1 - Math.pow(1 - k / 10, 1 / 5)), "sfx", 0.08, 0.4, 0.02);

	// ---------- act 4: build + final
	play(() => whoosh(0.55, 250, 3500), TL.fanIn - 0.05, "sfx", 0.45, 0, 0.2);
	RA.build.slice(1).forEach((n, i) => play(() => supersaw(hz(n), 1.0, { att: 0.02, cut: 1500, sus: 0.8, rel: 0.05, sweep: 1 }), 12.5, "pump", 0.13, i - 1, 0.3));
	TL.kinds.forEach((t, i) => {
		K(t, 0.9);
		play(() => clap(), t, "drums", 0.3 + i * 0.06, 0, 0.2, "clap");
		play(() => subBass(hz(RA.build[0]), 0.2), t, "pump", 0.5, 0, 0, "bsub");
	});
	for (let k = 0; k < 16; k++) play(() => snare({ decay: 30 }), 12.5 + k * 0.0625, "drums", 0.05 + (k / 16) * 0.2, 0.1, 0.1, "roll");
	play(() => riser(1.0, 300, 10000), 12.5, "sfx", 0.45, 0, 0.2);
	play(() => revCymbal(0.7), TL.final - 0.7, "sfx", 0.3, 0, 0.2);
	play(() => impact(), TL.final, "sfx", 1.3, 0, 0.3);
	play(() => crash(2.6), TL.final, "drums", 0.4, -0.1, 0.35, "crash");
	K(TL.final, 1);
	RA.final.forEach((n, i) => play(() => supersaw(hz(n), 1.2, { att: 0.005, cut: 5200, dec: 0.6, sus: 0.45, rel: 0.4 }), TL.final, "pump", 0.13, (i / 5) * 2 - 1, 0.5));
	play(() => subBass(hz("C1"), 1.2), TL.final, "pump", 0.6, 0, 0);
	play(() => sparkle(12, 84, 0.9), TL.final + 0.06, "sfx", 0.4, 0, 0.5);
	[14.15, 14.35].forEach((t) => {
		for (let k = 0; k < 8; k++) play(() => blip(4000 + k * 120, 0.02), t + k * 0.05, "sfx", 0.05, 0.2, 0.05);
	});

	// ---------- sidechain pump on pads/bass/arps
	const [PL, PR] = bus.pump;
	kicks.sort((a, b) => a - b);
	let ki = 0;
	for (let n = 0; n < len; n++) {
		const t = n / SR;
		while (ki + 1 < kicks.length && kicks[ki + 1] <= t) ki++;
		const since = kicks.length && t >= kicks[ki] ? t - kicks[ki] : 9;
		const g = 0.3 + 0.7 * (1 - Math.exp(-since / 0.085));
		PL[n] *= g;
		PR[n] *= g;
	}

	// ---------- drop-outs: a beat of near-silence before each big impact
	for (const hit of [TL.hit, TL.final]) {
		const a = Math.floor((hit - 0.075) * SR);
		const b = Math.floor((hit - 0.005) * SR);
		for (const k of ["pump", "drums", "sfx", "rev"])
			for (const ch of bus[k])
				for (let n = a - 240; n < b; n++) {
					const g = n < a ? 1 - (n - (a - 240)) / 240 : 0.04;
					ch[n] *= g;
				}
	}

	// ---------- graph: reverb, glue compression, master
	const ctx = new OfflineAudioContext(2, len, SR);
	const master = ctx.createGain();
	const comp = ctx.createDynamicsCompressor();
	comp.threshold.value = -12;
	comp.knee.value = 8;
	comp.ratio.value = 2.5;
	comp.attack.value = 0.004;
	comp.release.value = 0.12;
	const hpf = ctx.createBiquadFilter();
	hpf.type = "highpass";
	hpf.frequency.value = 30;
	master.connect(hpf);
	hpf.connect(comp);
	comp.connect(ctx.destination);
	const reverb = ctx.createConvolver();
	reverb.buffer = makeIR(ctx, 1.8);
	const rg = ctx.createGain();
	rg.gain.value = 0.3;
	reverb.connect(rg);
	rg.connect(master);
	const src = (arrs, dest, gain) => {
		const b = ctx.createBuffer(2, len, SR);
		b.copyToChannel(arrs[0], 0);
		b.copyToChannel(arrs[1], 1);
		const s = ctx.createBufferSource();
		s.buffer = b;
		const g = ctx.createGain();
		g.gain.value = gain;
		s.connect(g);
		g.connect(dest);
		s.start(0);
	};
	src(bus.pump, master, 0.8);
	src(bus.drums, master, 0.85);
	src(bus.sfx, master, 0.75);
	src(bus.rev, reverb, 1);
	const out = await ctx.startRendering();
	const L = out.getChannelData(0);
	const Rr = out.getChannelData(1);
	let pk = 0;
	for (let n = 0; n < L.length; n++) pk = Math.max(pk, Math.abs(L[n]), Math.abs(Rr[n]));
	const g = pk > 0 ? 0.89 / pk : 1;
	const fade = Math.floor((REEL_DUR - 0.5) * SR);
	for (let n = 0; n < L.length; n++) {
		const ff = n > fade ? Math.max(0, 1 - (n - fade) / (L.length - fade)) : 1;
		L[n] *= g * ff;
		Rr[n] *= g * ff;
	}
	return out;
}

/* Player shell for the reel + hooks for the frame exporter (window.REEL). */
"use strict";

(function () {
	const vp = document.getElementById("viewport");
	const stage = document.getElementById("stage");
	const btn = document.getElementById("play");
	const scrub = document.getElementById("scrub");
	const fill = document.getElementById("scrubFill");
	const time = document.getElementById("time");
	const exportMode = /[?&]export\b/.test(location.search);
	if (exportMode) {
		vp.classList.add("export");
		document.body.classList.add("export");
	}

	function fit() {
		const s = exportMode ? 1 : vp.clientWidth / 1920;
		stage.style.transform = `scale(${s})`;
	}
	window.addEventListener("resize", fit);
	fit();

	let actx = null;
	let src = null;
	let playing = false;
	let startAt = 0;
	let pausedT = 0;
	let raf = 0;
	let audio = null;

	const ready = (async () => {
		await Promise.all([
			document.fonts.load("800 100px 'Unbounded'"),
			document.fonts.load("600 20px 'Space Grotesk'"),
			document.fonts.load("600 20px 'Hanken Grotesk'"),
			document.fonts.load("500 20px 'JetBrains Mono'"),
		]);
		buildReel();
		initCanvases();
		layoutReel();
		render(14.9);
		if (!exportMode) audio = await buildReelSoundtrack();
	})();

	const now = () => (playing ? Math.min(REEL_DUR, actx.currentTime - startAt) : pausedT);
	function tick() {
		const t = now();
		render(t);
		fill.style.width = `${(t / REEL_DUR) * 100}%`;
		time.textContent = `${t.toFixed(1)} / ${REEL_DUR.toFixed(1)}`;
		if (playing && t >= REEL_DUR) return stop(REEL_DUR);
		if (playing) raf = requestAnimationFrame(tick);
	}
	function start(from) {
		actx ??= new AudioContext();
		if (actx.state === "suspended") actx.resume();
		if (src) src.stop();
		src = actx.createBufferSource();
		src.buffer = audio;
		src.connect(actx.destination);
		const t0 = actx.currentTime + 0.05;
		src.start(t0, from);
		startAt = t0 - from;
		playing = true;
		btn.textContent = "PAUSE";
		cancelAnimationFrame(raf);
		raf = requestAnimationFrame(tick);
	}
	function stop(at) {
		pausedT = at ?? now();
		playing = false;
		btn.textContent = pausedT >= REEL_DUR ? "REPLAY" : "PLAY WITH SOUND";
		if (src) {
			src.stop();
			src = null;
		}
		cancelAnimationFrame(raf);
		tick();
	}
	async function toggle() {
		if (playing) return stop();
		btn.textContent = "LOADING…";
		await ready;
		start(pausedT >= REEL_DUR - 0.05 ? 0 : pausedT);
	}
	btn.addEventListener("click", toggle);
	scrub.addEventListener("click", async (e) => {
		await ready;
		const r = scrub.getBoundingClientRect();
		const t = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * REEL_DUR;
		if (playing) start(t);
		else {
			pausedT = t;
			tick();
		}
	});
	window.addEventListener("keydown", (e) => {
		if (e.code === "Space") {
			e.preventDefault();
			toggle();
		}
	});

	window.REEL = {
		ready,
		duration: REEL_DUR,
		frame(t) {
			render(t);
		},
		async wavBase64() {
			const ab = await buildReelSoundtrack();
			const u = new Uint8Array(encodeWav(ab));
			let s = "";
			for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
			return btoa(s);
		},
	};
})();

</script>
