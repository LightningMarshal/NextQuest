<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NextQuest Reel</title>
<meta name="description" content="A 15-second motion-graphics reel for NextQuest: propose games, vote in secret, let the picker decide, schedule and finish the backlog.">
<!--FONTS-->
<style>
@font-face { font-family: 'Unbounded'; src: url(assets/Unbounded.woff2) format('woff2'); font-weight: 400 900; font-display: block; }
@font-face { font-family: 'Geist'; src: url(assets/Geist.woff2) format('woff2'); font-weight: 400 800; font-display: block; }
@font-face { font-family: 'Geist Mono'; src: url(assets/GeistMono.woff2) format('woff2'); font-weight: 400 700; font-display: block; }
</style>
<!--/FONTS-->
<style>
:root {
	--ink: #06080b;
	--surface: #12151b;
	--surface-2: #1a1f27;
	--line: #262d38;
	--fg: #e7ebf1;
	--dim: #8a93a3;
	--cyan: #34d1e6;
	--violet: #8b7cff;
	--green: #3fcf8e;
	--amber: #ffc94a;
	--coral: #ff6b6b;
	--page: #0b0d11;
	--page-fg: #e7ebf1;
	--page-dim: #8a93a3;
	color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
	background: var(--page);
	color: var(--page-fg);
	font-family: 'Geist', system-ui, sans-serif;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 14px;
	padding: 16px;
	overflow-x: hidden;
}
#viewport {
	position: relative;
	width: min(100%, calc((100vh - 110px) * 16 / 9));
	aspect-ratio: 16 / 9;
	max-width: 100%;
	overflow: hidden;
	border-radius: 12px;
	background: var(--ink);
	box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}
body.export { padding: 0; display: block; overflow: hidden; }
#viewport.export { width: 1920px; height: 1080px; border-radius: 0; box-shadow: none; aspect-ratio: auto; }
#stage {
	position: absolute;
	left: 0;
	top: 0;
	width: 1920px;
	height: 1080px;
	transform-origin: 0 0;
	overflow: hidden;
	background: var(--ink);
	perspective: 1700px;
	perspective-origin: 50% 46%;
	font-family: 'Geist', system-ui, sans-serif;
	color: var(--fg);
	contain: strict;
}
#stage canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
#fx { pointer-events: none; }
.abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; transform-style: preserve-3d; }
#world { position: absolute; inset: 0; transform-style: flat; perspective: 1700px; perspective-origin: 960px 500px; }

/* ---------- act 1: the wall of games */
#wallWrap { left: 960px; top: 540px; width: 0; height: 0; }
#wall { left: -1260px; top: -1500px; width: 2520px; display: grid; grid-template-columns: repeat(12, 196px); gap: 14px; }
.tile {
	height: 250px;
	border-radius: 14px;
	position: relative;
	overflow: hidden;
	border: 1px solid rgba(255, 255, 255, 0.07);
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}
.art { position: absolute; inset: 0; }
.tile .t { position: absolute; left: 12px; right: 12px; bottom: 30px; font: 700 17px/1.1 'Geist', sans-serif; color: #fff; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6); }
.tile .k { position: absolute; left: 12px; bottom: 10px; font: 600 10px 'Geist Mono', monospace; letter-spacing: 0.08em; padding: 2px 6px; border-radius: 4px; background: rgba(0, 0, 0, 0.45); color: #fff; }
#laser { left: 0; top: 539px; width: 1920px; height: 2px; background: linear-gradient(90deg, transparent, var(--cyan) 20%, #fff 50%, var(--cyan) 80%, transparent); box-shadow: 0 0 18px var(--cyan), 0 0 50px rgba(52, 209, 230, 0.6); }
#count { left: 960px; top: 540px; width: 0; height: 0; }
#countNum { position: absolute; left: -700px; width: 1400px; top: -230px; text-align: center; font: 900 300px/1 'Unbounded', sans-serif; letter-spacing: -0.04em; color: #fff; font-variant-numeric: tabular-nums; }
#countLbl { position: absolute; left: -700px; width: 1400px; top: 110px; text-align: center; font: 500 30px 'Geist Mono', monospace; letter-spacing: 0.32em; color: var(--dim); }
#words { left: 960px; top: 540px; width: 0; height: 0; }
.kw { position: absolute; left: -900px; width: 1800px; top: -130px; text-align: center; font: 900 220px/1.1 'Unbounded', sans-serif; letter-spacing: -0.035em; color: #fff; white-space: nowrap; }
.kw.cy { color: var(--cyan); }

/* ---------- logo */
.mark { position: absolute; border-radius: 24%; background: linear-gradient(145deg, #1b2029, #0b0d11 70%); border: 2px solid rgba(255, 255, 255, 0.09); box-shadow: 0 0 0 1px rgba(52, 209, 230, 0.15), 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08); }
.mark svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.wm { position: absolute; white-space: nowrap; font: 800 150px/1 'Unbounded', sans-serif; letter-spacing: -0.04em; }
.wm span { display: inline-block; }
.wm .n { background: linear-gradient(100deg, #e7ebf1 0%, #e7ebf1 42%, #ffffff 50%, #e7ebf1 58%, #e7ebf1 100%); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
.wm .q { background: linear-gradient(100deg, #34d1e6 0%, #34d1e6 42%, #c8f6fc 50%, #34d1e6 58%, #8b7cff 100%); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
.mask { overflow: hidden; display: inline-block; vertical-align: top; padding-bottom: 0.08em; }
.wd { display: inline-block; }
#ring { left: 960px; top: 540px; width: 0; height: 0; }
#ring i { position: absolute; border-radius: 50%; border: 3px solid var(--cyan); }
.mono { font-family: 'Geist Mono', monospace; }

/* ---------- act 3: feature panels */
#heads { left: 150px; top: 250px; width: 700px; height: 560px; }
.hl { position: absolute; left: 0; top: 0; width: 760px; }
.hl .idx { font: 600 24px 'Geist Mono', monospace; letter-spacing: 0.24em; color: var(--cyan); display: flex; gap: 16px; align-items: center; }
.hl .idx b { color: var(--fg); font-weight: 600; }
.hl .idx::after { content: ""; width: 120px; height: 2px; background: linear-gradient(90deg, var(--cyan), transparent); }
.hl .big { margin-top: 26px; font: 800 96px/1.02 'Unbounded', sans-serif; letter-spacing: -0.045em; color: #fff; }
.hl .big .ln { display: block; overflow: hidden; padding-bottom: 6px; }
.hl .big .ln > span { display: inline-block; }
.hl .big em { font-style: normal; color: var(--cyan); }
.hl .sub { margin-top: 30px; font: 400 30px/1.4 'Geist', sans-serif; color: var(--dim); max-width: 620px; }
#panels { left: 1370px; top: 540px; width: 0; height: 0; transform-style: preserve-3d; }
.panel {
	position: absolute;
	left: -500px;
	top: -330px;
	width: 1000px;
	height: 660px;
	border-radius: 22px;
	background: linear-gradient(180deg, #151920, #0f1217);
	border: 1px solid var(--line);
	box-shadow: 0 50px 120px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(52, 209, 230, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.06);
	overflow: hidden;
	font-family: 'Geist', sans-serif;
	backface-visibility: hidden;
}
.panel::before { content: ""; position: absolute; inset: 0; border-radius: 22px; padding: 1px; background: linear-gradient(140deg, rgba(52, 209, 230, 0.6), transparent 35%, transparent 65%, rgba(139, 124, 255, 0.5)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.pbar { height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 22px; border-bottom: 1px solid var(--line); font: 600 20px 'Geist', sans-serif; color: var(--dim); }
.pbar .dots { display: flex; gap: 8px; }
.pbar .dots i { width: 12px; height: 12px; border-radius: 50%; background: #2a313b; }
.pbar .crumb { color: var(--fg); }
.pbar .chev { width: 26px; height: 26px; }
.pb { padding: 26px 30px; display: flex; flex-direction: column; gap: 20px; }
.search { height: 74px; border-radius: 16px; background: #0b0d11; border: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 0 22px; font: 500 30px 'Geist', sans-serif; }
.search.focus { border-color: var(--cyan); box-shadow: 0 0 0 4px rgba(52, 209, 230, 0.15); }
.search svg { width: 28px; height: 28px; flex: none; }
.caret { width: 3px; height: 36px; background: var(--cyan); }
.kbd { margin-left: auto; font: 500 18px 'Geist Mono', monospace; color: var(--dim); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; }
.chips { display: flex; gap: 12px; }
.chip { font: 600 17px 'Geist Mono', monospace; letter-spacing: 0.08em; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
.chip.on-v { color: var(--cyan); border-color: var(--cyan); background: rgba(52, 209, 230, 0.12); }
.chip.on-t { color: var(--violet); border-color: var(--violet); background: rgba(139, 124, 255, 0.14); }
.chip.on-b { color: var(--green); border-color: var(--green); background: rgba(63, 207, 142, 0.12); }
.gcard { position: relative; display: flex; gap: 26px; padding: 22px; border-radius: 18px; background: var(--surface-2); border: 1px solid var(--line); }
.cover { width: 220px; height: 290px; border-radius: 12px; flex: none; position: relative; overflow: hidden; }
.ginfo { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.gtitle { font: 800 46px/1.05 'Unbounded', sans-serif; letter-spacing: -0.03em; }
.gmeta { font: 500 20px 'Geist', sans-serif; color: var(--dim); }
.stats { display: flex; gap: 12px; margin-top: 12px; }
.stat { width: 150px; padding: 14px 16px; border-radius: 14px; background: #0f1217; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.stat b { font: 700 30px 'Geist', sans-serif; }
.stat i { font: 500 15px 'Geist Mono', monospace; font-style: normal; letter-spacing: 0.1em; color: var(--dim); text-transform: uppercase; }
.pips { color: var(--coral); letter-spacing: 0.08em; }
.effort { position: absolute; right: 24px; bottom: 22px; width: 196px; height: 196px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 35% 30%, #5fe3f2, #19a9bd 70%); color: #04161a; box-shadow: 0 0 0 8px rgba(52, 209, 230, 0.16), 0 20px 50px rgba(52, 209, 230, 0.35); }
.effn { font: 900 84px/1 'Unbounded', sans-serif; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.effl { font: 700 16px 'Geist Mono', monospace; letter-spacing: 0.24em; }
.form { position: absolute; right: 250px; bottom: 34px; font: 500 22px 'Geist Mono', monospace; color: var(--cyan); white-space: nowrap; }
/* vote */
.vrow { display: grid; grid-template-columns: 64px 1fr 190px 210px; gap: 18px; align-items: center; padding: 12px 16px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); }
.thumb { width: 64px; height: 64px; border-radius: 12px; position: relative; overflow: hidden; }
.vt { font: 700 26px 'Geist', sans-serif; }
.vt small { display: block; font: 600 14px 'Geist Mono', monospace; letter-spacing: 0.1em; margin-top: 4px; }
.step { display: flex; align-items: center; justify-content: space-between; height: 56px; border-radius: 14px; background: #0b0d11; border: 1px solid var(--line); padding: 0 8px; }
.step i { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font: 600 26px 'Geist', sans-serif; font-style: normal; color: var(--dim); background: #1a1f27; }
.step i.hot { background: var(--cyan); color: #04161a; }
.step b { font: 800 30px 'Geist', sans-serif; font-variant-numeric: tabular-nums; }
.tot { height: 14px; border-radius: 7px; background: #0b0d11; overflow: hidden; position: relative; }
.tot > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px; background: linear-gradient(90deg, var(--violet), var(--cyan)); }
.vhead { display: flex; align-items: flex-end; justify-content: space-between; }
.vleft { font: 800 64px/1 'Unbounded', sans-serif; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.vleft small { font: 500 22px 'Geist Mono', monospace; letter-spacing: 0.14em; color: var(--dim); margin-left: 12px; }
.lock { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--amber); color: var(--amber); background: rgba(255, 201, 74, 0.1); font: 700 20px 'Geist Mono', monospace; letter-spacing: 0.12em; }
.lock svg { width: 22px; height: 22px; }
/* pick */
.ctx { display: flex; gap: 12px; align-items: center; font: 500 20px 'Geist', sans-serif; color: var(--dim); }
.ctx .chip { color: var(--fg); }
.legend { display: flex; gap: 22px; font: 600 16px 'Geist Mono', monospace; letter-spacing: 0.1em; color: var(--dim); margin-left: auto; }
.legend span { display: flex; align-items: center; gap: 8px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; }
.prow { position: absolute; top: 0; left: 30px; right: 30px; height: 104px; display: grid; grid-template-columns: 80px 270px 1fr 92px; gap: 20px; align-items: center; padding: 0 18px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); }
.prow .thumb { width: 80px; height: 72px; }
.bar { height: 22px; border-radius: 11px; background: #0b0d11; position: relative; overflow: hidden; }
.bar i { position: absolute; top: 0; bottom: 0; }
.score { font: 800 42px 'Unbounded', sans-serif; letter-spacing: -0.04em; text-align: right; font-variant-numeric: tabular-nums; }
.nextup { position: absolute; right: -14px; top: -18px; padding: 8px 16px; border-radius: 10px; background: var(--amber); color: #2a1c00; font: 800 18px 'Geist Mono', monospace; letter-spacing: 0.18em; box-shadow: 0 10px 30px rgba(255, 201, 74, 0.4); }
/* play */
.split { display: grid; grid-template-columns: 440px 1fr; gap: 20px; height: 540px; }
.card { border-radius: 18px; background: var(--surface-2); border: 1px solid var(--line); padding: 20px; position: relative; overflow: hidden; }
.card h4 { margin: 0 0 14px; font: 700 22px 'Geist', sans-serif; display: flex; justify-content: space-between; }
.card h4 span { font: 500 16px 'Geist Mono', monospace; color: var(--dim); letter-spacing: 0.08em; }
.heat { display: grid; grid-template-columns: 54px repeat(5, 1fr); gap: 6px; font: 500 14px 'Geist Mono', monospace; color: var(--dim); }
.heat .c { height: 56px; border-radius: 8px; background: #0b0d11; }
.heat .h { display: flex; align-items: center; }
.heat .d { text-align: center; padding-bottom: 4px; }
.toast { position: absolute; left: 20px; right: 20px; bottom: 20px; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; background: #0b0d11; border: 1px solid var(--cyan); }
.toast .when { font: 800 22px 'Geist', sans-serif; color: var(--cyan); }
.toast .who { display: flex; margin-left: auto; }
.toast .who i { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #0b0d11; margin-left: -10px; }
.chart svg { width: 100%; height: 360px; overflow: visible; }
.kpis { display: flex; gap: 12px; margin-top: 10px; }
.kpi { flex: 1; min-width: 0; padding: 12px 12px; border-radius: 12px; background: #0f1217; border: 1px solid var(--line); }
.kpi b { display: block; font: 800 26px 'Unbounded', sans-serif; letter-spacing: -0.03em; white-space: nowrap; }
.kpi i { font: 500 12px 'Geist Mono', monospace; font-style: normal; color: var(--dim); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
#rail { left: 150px; top: 930px; display: flex; gap: 16px; }
.seg { width: 200px; }
.seg .lb { font: 600 17px 'Geist Mono', monospace; letter-spacing: 0.2em; color: var(--dim); margin-bottom: 12px; }
.seg .tr { height: 3px; background: rgba(255, 255, 255, 0.12); position: relative; overflow: hidden; border-radius: 2px; }
.seg .tr i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
/* act 4 */
#kinds { left: 960px; top: 165px; width: 0; height: 0; }
.kd { position: absolute; left: -900px; width: 1800px; text-align: center; font: 800 66px/1 'Unbounded', sans-serif; letter-spacing: -0.03em; white-space: nowrap; }
#lock { left: 960px; top: 470px; width: 0; height: 0; }
.tag { position: absolute; left: -900px; width: 1800px; text-align: center; font: 700 56px/1.15 'Unbounded', sans-serif; letter-spacing: -0.035em; }
.meta { position: absolute; left: -900px; width: 1800px; text-align: center; font: 500 22px "Geist Mono", monospace; letter-spacing: 0.22em; color: #aab3c2; }

/* ---------- player chrome (not part of the frame) */
#controls { display: flex; align-items: center; gap: 14px; width: min(100%, calc((100vh - 110px) * 16 / 9)); font: 500 14px 'Geist Mono', monospace; color: var(--page-dim); }
#controls button { font: 600 14px 'Geist Mono', monospace; letter-spacing: 0.08em; background: var(--cyan); color: #04161a; border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; }
#controls button:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
#scrub { flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.14); position: relative; cursor: pointer; }
#scrubFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--cyan); border-radius: 2px; }
#time { min-width: 92px; text-align: right; font-variant-numeric: tabular-nums; }
#viewport.export ~ #controls { display: none; }
</style>
</head>
<body>
<div id="viewport">
	<div id="stage">
		<canvas id="bg" width="1920" height="1080"></canvas>
		<div id="world"></div>
		<canvas id="fx" width="1920" height="1080"></canvas>
	</div>
</div>
<div id="controls">
	<button id="play" type="button">PLAY WITH SOUND</button>
	<div id="scrub"><div id="scrubFill"></div></div>
	<span id="time">0.0 / 15.0</span>
</div>
<!--SCRIPTS-->
<script src="../animation/src/audio.js"></script>
<script src="src/reel.js"></script>
<script src="src/reel-audio.js"></script>
<script src="src/player.js"></script>
<!--/SCRIPTS-->
</body>
</html>
